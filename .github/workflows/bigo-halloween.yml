name: BIGO Halloween Source Discovery
on:
  push:
    branches: [pro-bigo-halloween-20260908]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests beautifulsoup4
      - run: python discover.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bigo-halloween-discovery
          path: output/
          retention-days: 14
