name: Pro-BIGO Christmas New Year OneLink Probe

on:
  push:
    branches:
      - pro-bigo-complex5-79000-20260827
    paths:
      - 'tmp/pro-bigo-complex5/probe_onelink.py'
      - '.github/workflows/pro-bigo-onelink-probe.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install requests
      - run: python tmp/pro-bigo-complex5/probe_onelink.py
      - uses: actions/upload-artifact@v4
        with:
          name: pro-bigo-onelink-probe
          path: pro-bigo-onelink-probe
          retention-days: 14
