name: Pro-BIGO Rocket-standard Asset Recovery

on:
  push:
    branches:
      - pro-bigo-rocket-assets-20260826
    paths:
      - 'tmp/pro-bigo-rocket-assets/**'
      - '.github/workflows/pro-bigo-rocket-assets.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install runtime
        run: python -m pip install --disable-pip-version-check requests

      - name: Download official BIGO assets and sources
        run: python tmp/pro-bigo-rocket-assets/download.py

      - name: Upload complete source artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pro-bigo-rocket-assets-output
          path: |
            pro-bigo-rocket-assets-output
            pro-bigo-rocket-assets-output.zip
          if-no-files-found: warn
          compression-level: 0
          retention-days: 14
