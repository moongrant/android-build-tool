name: Pro Falla batch 11 latest-ID discovery

on:
  pull_request:
    branches: [research/pro-falla-batch10-20260827]
    paths:
      - '.github/workflows/pro-falla-batch11-latest-discovery.yml'
      - 'tools/pro-falla-batch4/discover.py'
      - 'tools/pro-falla-batch4/contact_sheet.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  discover-latest:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/pro-falla-batch11-20260827
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          set -Eeuo pipefail
          python -m pip install --disable-pip-version-check aiohttp playwright pillow
          python -m playwright install --with-deps chromium
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-noto-cjk
      - name: Scan latest public activity IDs
        env:
          OUT_DIR: ${{ github.workspace }}/artifacts/pro-falla-batch11-latest-discovery
          START_ID: '1500'
          END_ID: '2400'
          HTTP_CONCURRENCY: '64'
          CAPTURE_LIMIT: '80'
          CAPTURE_CONCURRENCY: '8'
          CAPTURE_WAIT_MS: '6000'
        run: |
          set -Eeuo pipefail
          python tools/pro-falla-batch4/discover.py
          python tools/pro-falla-batch4/contact_sheet.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pro-falla-batch11-latest-discovery
          path: artifacts/pro-falla-batch11-latest-discovery
          if-no-files-found: error
          retention-days: 14
          compression-level: 6
