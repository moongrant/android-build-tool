name: Pro Falla batch 11 wave 1 original SPA recovery

on:
  pull_request:
    branches: [research/pro-falla-batch10-20260827]
    paths:
      - '.github/workflows/pro-falla-batch11-wave1-archive.yml'
      - 'tools/pro-falla-batch11-wave1/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/pro-falla-batch11-wave1-20260827
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          set -Eeuo pipefail
          npm install playwright@1.54.2 --no-save
          npx playwright install --with-deps chromium
          python -m pip install --disable-pip-version-check pillow
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-noto-cjk
      - name: Generate and patch archiver
        run: |
          set -Eeuo pipefail
          python -m py_compile tools/pro-falla-batch11-wave1/make_archiver.py tools/pro-falla-batch11-wave1/patch_wave1.py
          python tools/pro-falla-batch11-wave1/make_archiver.py
          python -m py_compile tools/pro-falla-batch11-wave1/_builder_generated.py
          python tools/pro-falla-batch11-wave1/_builder_generated.py
          python tools/pro-falla-batch11-wave1/patch_wave1.py
          node --check tools/pro-falla-batch11-wave1/archive_wave1.mjs
      - name: Capture and replay original Falla SPAs
        env:
          OUT_DIR: ${{ github.workspace }}/artifacts/pro-falla-batch11-wave1-original-spa
          ONLINE_WAIT_MS: '6800'
          OFFLINE_WAIT_MS: '5400'
          PAGE_CONCURRENCY: '3'
        run: |
          set -Eeuo pipefail
          node tools/pro-falla-batch11-wave1/archive_wave1.mjs
      - name: Build contact sheets
        env:
          OUT_DIR: ${{ github.workspace }}/artifacts/pro-falla-batch11-wave1-original-spa
        run: |
          set -Eeuo pipefail
          python -m py_compile tools/pro-falla-batch4/contact_sheets_original.py
          python tools/pro-falla-batch4/contact_sheets_original.py
      - name: Print QA
        if: always()
        run: |
          cat artifacts/pro-falla-batch11-wave1-original-spa/QA-FINAL.md >> "$GITHUB_STEP_SUMMARY" || true
          du -sh artifacts/pro-falla-batch11-wave1-original-spa || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pro-falla-batch11-wave1-original-spa-repaired
          path: artifacts/pro-falla-batch11-wave1-original-spa
          if-no-files-found: error
          retention-days: 14
          compression-level: 6
