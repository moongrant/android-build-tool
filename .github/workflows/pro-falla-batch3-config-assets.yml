name: Pro Falla batch 3 config asset closure

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/pro-falla-batch3-config-assets.yml'
      - 'tools/pro-falla-batch3/download_config_assets.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  download:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/pro-falla-batch3-20260819
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check aiohttp
      - name: Download config closure
        env:
          OUT_DIR: ${{ github.workspace }}/artifacts/pro-falla-batch3-config-assets
        run: |
          python -m py_compile tools/pro-falla-batch3/download_config_assets.py
          python tools/pro-falla-batch3/download_config_assets.py
      - if: always()
        run: cat artifacts/pro-falla-batch3-config-assets/REPORT.md >> "$GITHUB_STEP_SUMMARY" || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pro-falla-batch3-config-assets
          path: artifacts/pro-falla-batch3-config-assets
          if-no-files-found: error
          retention-days: 14
          compression-level: 6
