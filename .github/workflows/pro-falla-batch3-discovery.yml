name: Pro Falla batch 3 discovery

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/pro-falla-batch3-discovery.yml'
      - 'tools/pro-falla-batch3/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/pro-falla-batch3-20260819

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          set -Eeuo pipefail
          python -m pip install --upgrade pip
          python -m pip install aiohttp playwright pillow
          python -m playwright install --with-deps chromium
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-noto-cjk

      - name: Discover and capture public Falla H5 candidates
        env:
          PYTHONUNBUFFERED: '1'
          OUT_DIR: ${{ github.workspace }}/artifacts/pro-falla-batch3-discovery
          START_ID: '1'
          END_ID: '1800'
          HTTP_CONCURRENCY: '18'
          CAPTURE_LIMIT: '72'
          CAPTURE_CONCURRENCY: '4'
        run: |
          set -Eeuo pipefail
          python -m py_compile tools/pro-falla-batch3/discover.py
          python tools/pro-falla-batch3/discover.py

      - name: Print summary
        if: always()
        run: |
          if [[ -f artifacts/pro-falla-batch3-discovery/REPORT.md ]]; then
            cat artifacts/pro-falla-batch3-discovery/REPORT.md >> "$GITHUB_STEP_SUMMARY"
          fi
          du -sh artifacts/pro-falla-batch3-discovery || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pro-falla-batch3-discovery
          path: artifacts/pro-falla-batch3-discovery
          if-no-files-found: error
          retention-days: 14
          compression-level: 6
