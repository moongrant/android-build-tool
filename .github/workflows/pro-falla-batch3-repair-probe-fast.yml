name: Pro Falla batch 3 repair probe fast

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/pro-falla-batch3-repair-probe-fast.yml'
      - 'tools/pro-falla-batch3/repair_probe_fast.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/pro-falla-batch3-20260819
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check aiohttp
      - name: Probe
        env:
          OUT_DIR: ${{ github.workspace }}/artifacts/pro-falla-batch3-repair-probe-fast
        run: |
          python -m py_compile tools/pro-falla-batch3/repair_probe_fast.py
          python tools/pro-falla-batch3/repair_probe_fast.py
      - if: always()
        run: cat artifacts/pro-falla-batch3-repair-probe-fast/REPORT.md >> "$GITHUB_STEP_SUMMARY" || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pro-falla-batch3-repair-probe-fast
          path: artifacts/pro-falla-batch3-repair-probe-fast
          if-no-files-found: error
          retention-days: 14
          compression-level: 6
