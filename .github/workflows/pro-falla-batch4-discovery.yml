name: Pro Falla batch 4 discovery

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/pro-falla-batch4-discovery.yml'
      - 'tools/pro-falla-batch4/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/pro-falla-batch4-20260820
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install discovery dependencies
        run: |
          set -Eeuo pipefail
          python -m pip install --disable-pip-version-check aiohttp playwright pillow
          python -m playwright install --with-deps chromium
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-noto-cjk
      - name: Discover unknown Falla H5 projects
        env:
          OUT_DIR: ${{ github.workspace }}/artifacts/pro-falla-batch4-discovery
          START_ID: '1'
          END_ID: '2600'
          HTTP_CONCURRENCY: '30'
          CAPTURE_LIMIT: '72'
          CAPTURE_CONCURRENCY: '4'
          CAPTURE_WAIT_MS: '6500'
        run: |
          set -Eeuo pipefail
          python -m py_compile tools/pro-falla-batch4/discover.py tools/pro-falla-batch4/contact_sheet.py
          python tools/pro-falla-batch4/discover.py
          python tools/pro-falla-batch4/contact_sheet.py
      - name: Print report
        if: always()
        run: |
          cat artifacts/pro-falla-batch4-discovery/REPORT.md >> "$GITHUB_STEP_SUMMARY" || true
          du -sh artifacts/pro-falla-batch4-discovery || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pro-falla-batch4-discovery
          path: artifacts/pro-falla-batch4-discovery
          if-no-files-found: error
          retention-days: 14
          compression-level: 6
