name: Pro Yalla football archive debug round 4

on:
  push:
    branches:
      - research/pro-yalla-official-increment-r4-20260826
    paths:
      - .github/workflows/pro-yalla-football-archive-debug-r4.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  recover:
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Restore crawler
        run: |
          set -Eeuo pipefail
          cat tools/pro-yalla/v2.part.* > /tmp/crawler.b64
          echo '9e95cb71e8b568915884c5c91a7c7cf5a8eeea14152610495ffb2a52f594cabe  /tmp/crawler.b64' | sha256sum --check
          base64 --decode /tmp/crawler.b64 | gzip --decompress > tools/pro-yalla/pro_yalla_archive_v2.py
          echo 'e505de4a67241d259f0e1a169a790f2b38e9b07fc9898ce40a12ac00e87f22bd  tools/pro-yalla/pro_yalla_archive_v2.py' | sha256sum --check
      - name: Install crawler dependencies
        run: python -m pip install --quiet requests beautifulsoup4 lxml playwright
      - name: Recover Football Carnival closure
        env:
          PYTHONUNBUFFERED: '1'
        run: |
          python - <<'PY'
          import importlib.util, json, pathlib, traceback, sys
          root=pathlib.Path('artifacts/football-archive-debug')
          closure=root/'closure'
          root.mkdir(parents=True,exist_ok=True)
          spec=importlib.util.spec_from_file_location('crawler','tools/pro-yalla/pro_yalla_archive_v2.py')
          m=importlib.util.module_from_spec(spec); sys.modules[spec.name]=m; spec.loader.exec_module(m)
          m.MAX_FILES=5000; m.MAX_TOTAL=400*1024*1024
          try:
            result=m.crawl(closure,'https://activity2.yalla.live/activity/2023dist/footballCarnival/','official-live-plus-public-archive')
            error=None
          except Exception:
            result=None; error=traceback.format_exc()
          files=[]
          for p in sorted(closure.rglob('*')):
            if p.is_file():
              files.append({'file':str(p.relative_to(root)),'bytes':p.stat().st_size,'suffix':p.suffix.lower()})
          payload={'result':result,'error':error,'fileCount':len(files),'totalBytes':sum(x['bytes'] for x in files),'files':files}
          (root/'result.json').write_text(json.dumps(payload,ensure_ascii=False,indent=2,default=str),encoding='utf-8')
          lines=['# Football Carnival archive debug','','- Files: '+str(payload['fileCount']),'- Bytes: '+str(payload['totalBytes']),'- Error: '+str(bool(error)),'','## Types','']
          from collections import Counter
          counts=Counter(x['suffix'] or '[no-ext]' for x in files)
          lines += [f'- `{k}`: {v}' for k,v in sorted(counts.items())]
          (root/'REPORT.md').write_text('\n'.join(lines)+'\n',encoding='utf-8')
          PY
      - name: Publish compact report
        if: always()
        run: |
          mkdir -p research-output/pro-yalla-football-archive-debug-r4
          cp artifacts/football-archive-debug/REPORT.md research-output/pro-yalla-football-archive-debug-r4/REPORT.md || true
          cp artifacts/football-archive-debug/result.json research-output/pro-yalla-football-archive-debug-r4/result.json || true
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research-output/pro-yalla-football-archive-debug-r4
          git commit -m 'Publish Football Carnival archive debug r4 [skip ci]' || true
          git pull --rebase origin "${GITHUB_REF_NAME}" || true
          git push origin "HEAD:${GITHUB_REF_NAME}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pro-yalla-football-archive-debug-r4
          path: artifacts/football-archive-debug
          if-no-files-found: warn
          retention-days: 30
