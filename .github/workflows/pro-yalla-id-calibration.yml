name: Pro Yalla campaign ID calibration

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/pro-yalla-id-calibration.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  calibrate:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install requests cryptography
      - name: Test date IDs and event IDs against public read endpoints
        run: |
          set -Eeuo pipefail
          mkdir -p artifacts/yalla-id-calibration
          cat > /tmp/calibrate.py <<'PY'
          from __future__ import annotations
          import base64, datetime as dt, json, time
          from pathlib import Path
          import requests
          from cryptography.hazmat.primitives import serialization
          from cryptography.hazmat.primitives.asymmetric import padding

          OUT=Path('artifacts/yalla-id-calibration'); OUT.mkdir(parents=True,exist_ok=True)
          S=requests.Session(); S.headers.update({'User-Agent':'Mozilla/5.0 (Linux; Android 14; Pixel 8) AppleWebKit/537.36 Chrome/127 Mobile Safari/537.36','Accept':'application/json,text/plain,*/*'})
          KEY=serialization.load_pem_public_key(b'''-----BEGIN PUBLIC KEY-----
          MIGfMA0GCSqGSIb3DQEBAQUAA4GNADCBiQKBgQCqiLQpZmnMJwRIz4O3V0cxxg/2
          UJ0nBriSSPt0i2HN5hlmq+zQYYQwDAvNiFs1R2OD6f2jJrCiiCLr9RmPhgVp1O+o
          yT8sH3RJ9f9BGIOPO6U1ar4p1V3b6juGRWDxkfUgN7MOYS/lgywfr+YTavrAvj8K
          UusZI5pu5Gm9+ML4NQIDAQAB
          -----END PUBLIC KEY-----''')
          def sign(token,ts): return base64.b64encode(KEY.encrypt(f'{token}|{ts}|Yalla-Activity-Headers'.encode(),padding.PKCS1v15())).decode()
          def dates(start,end,fmt='%y%m%d'):
              a=dt.datetime.strptime(start,'%Y-%m-%d').date(); b=dt.datetime.strptime(end,'%Y-%m-%d').date(); out=[]
              while a<=b: out.append(a.strftime(fmt)); a+=dt.timedelta(days=1)
              return out
          ids={
              'LuckyCarnival': sorted(set(['0','1','123','240112','241001','241022','241028','20241022','6737220863']+dates('2024-10-15','2024-11-05'))),
              'GeneralTemplateSweet': sorted(set(['0','1','240112','240207','20240207','6475700703']+dates('2024-02-01','2024-02-20'))),
              'GeneralTemplateTreasure': sorted(set(['0','1','260805','260811','20260805','1021917730722093']+dates('2026-08-01','2026-08-15'))),
              'AsianCup': ['0','240112','241022'],
              'KingCar': ['0','260805','260811'],
          }
          routes={
              'LuckyCarnival':['GetActivityInfo','Init','GetLotteryInfo','GetProcessInfo'],
              'GeneralTemplateSweet':['GetActivityInfo','Init'],
              'GeneralTemplateTreasure':['GetActivityInfo','Init'],
              'AsianCup':['GetActivityInfo','Init'],
              'KingCar':['GetActivityInfo','Init'],
          }
          module_map={'GeneralTemplateSweet':'GeneralTemplate','GeneralTemplateTreasure':'GeneralTemplate'}
          tokens=['','null','0']
          rows=[]
          for label,id_list in ids.items():
              module=module_map.get(label,label)
              for activity_id in id_list:
                  for action in routes[label]:
                      for token in tokens:
                          ts=str(int(time.time()*1000)); params={'region':'0','userId':'0','token':token,'v':'3501','s':'3','activityId':activity_id,'xtimestamp':ts,'xsignature':sign(token,ts)}
                          headers={k:str(v) for k,v in params.items()}; headers['Content-Type']='application/json'
                          url=f'https://activity2.yalla.live/api/{module}/{action}'
                          row={'label':label,'module':module,'action':action,'activityId':activity_id,'token_repr':token}
                          try:
                              r=S.get(url,params=params,headers=headers,timeout=(12,45)); row.update(status=r.status_code,bytes=len(r.content),ctype=r.headers.get('content-type'),body=r.text[:3000],final_url=r.url)
                          except Exception as e: row['error']=repr(e)
                          rows.append(row); time.sleep(.04)
          (OUT/'all-results.json').write_text(json.dumps(rows,ensure_ascii=False,indent=2))

          # Summaries by response fingerprint, useful for distinguishing valid IDs from generic no-content behavior.
          fingerprints={}
          for r in rows:
              key=(r['label'],r['action'],r['token_repr'],r.get('status'),r.get('bytes'),(r.get('body') or '')[:160])
              fingerprints.setdefault(str(key),[]).append(r['activityId'])
          (OUT/'fingerprints.json').write_text(json.dumps(fingerprints,ensure_ascii=False,indent=2))
          interesting=[]
          for r in rows:
              body=(r.get('body') or '').lower()
              if r.get('status')==200 or r.get('bytes',0)>200 or (r.get('status') not in (400,401,404,405,204,None)):
                  interesting.append(r)
          (OUT/'interesting.json').write_text(json.dumps(interesting,ensure_ascii=False,indent=2))

          report=['# Yalla campaign ID calibration','',f'Requests: {len(rows)}',f'Interesting responses: {len(interesting)}','']
          for label in ids:
              report += [f'## {label}','']
              subset=[r for r in rows if r['label']==label]
              groups={}
              for r in subset:
                  k=(r['action'],r['token_repr'],r.get('status'),r.get('bytes'),(r.get('body') or '')[:100])
                  groups.setdefault(k,[]).append(r['activityId'])
              for k,vals in groups.items():
                  report.append(f'- action={k[0]} token={repr(k[1])} status={k[2]} bytes={k[3]} ids={",".join(vals[:80])}')
              report += ['']
          (OUT/'REPORT.md').write_text('\n'.join(report))
          PY
          python /tmp/calibrate.py
      - name: Add report
        if: always()
        run: test -f artifacts/yalla-id-calibration/REPORT.md && cat artifacts/yalla-id-calibration/REPORT.md >> "$GITHUB_STEP_SUMMARY" || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pro-yalla-id-calibration
          path: artifacts/yalla-id-calibration
          if-no-files-found: error
          retention-days: 14
