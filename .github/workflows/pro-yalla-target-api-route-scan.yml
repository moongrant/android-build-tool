name: Pro Yalla target API route scan

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/pro-yalla-target-api-route-scan.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install HTTP and RSA dependencies
        run: |
          set -Eeuo pipefail
          python -m pip install --upgrade pip
          python -m pip install requests cryptography

      - name: Scan route existence and calibrate signed guest requests
        run: |
          set -Eeuo pipefail
          mkdir -p artifacts/pro-yalla-target-api-scan
          cat > /tmp/scan.py <<'PY'
          from __future__ import annotations
          import base64, itertools, json, time
          from pathlib import Path
          from urllib.parse import urlencode
          import requests
          from cryptography.hazmat.primitives import serialization
          from cryptography.hazmat.primitives.asymmetric import padding

          OUT=Path('artifacts/pro-yalla-target-api-scan')
          OUT.mkdir(parents=True,exist_ok=True)
          S=requests.Session()
          S.headers.update({'User-Agent':'Mozilla/5.0 (Linux; Android 14; Pixel 8) AppleWebKit/537.36 Chrome/127 Mobile Safari/537.36','Accept':'application/json,text/plain,*/*'})
          BASE='https://activity2.yalla.live'
          PUB=b'''-----BEGIN PUBLIC KEY-----
          MIGfMA0GCSqGSIb3DQEBAQUAA4GNADCBiQKBgQCqiLQpZmnMJwRIz4O3V0cxxg/2
          UJ0nBriSSPt0i2HN5hlmq+zQYYQwDAvNiFs1R2OD6f2jJrCiiCLr9RmPhgVp1O+o
          yT8sH3RJ9f9BGIOPO6U1ar4p1V3b6juGRWDxkfUgN7MOYS/lgywfr+YTavrAvj8K
          UusZI5pu5Gm9+ML4NQIDAQAB
          -----END PUBLIC KEY-----'''
          KEY=serialization.load_pem_public_key(PUB)

          def sign(token,ts):
              raw=f'{token}|{ts}|Yalla-Activity-Headers'.encode()
              return base64.b64encode(KEY.encrypt(raw,padding.PKCS1v15())).decode()

          def req(method,url,**kwargs):
              row={'method':method,'url':url}
              try:
                  r=S.request(method,url,timeout=(12,40),allow_redirects=True,**kwargs)
                  row.update(status=r.status_code,bytes=len(r.content),ctype=r.headers.get('content-type'),allow=r.headers.get('allow'),body=r.text[:5000],final_url=r.url)
              except Exception as e: row['error']=repr(e)
              return row

          # Public API documentation and route indexes.
          docs=[]
          for path in ['/swagger/v1/swagger.json','/swagger/index.html','/swagger.json','/openapi.json','/api-docs','/.well-known/openapi.json','/api/GeneralTemplate/Init']:
              docs.append(req('GET',BASE+path))
          (OUT/'api-doc-probes.json').write_text(json.dumps(docs,indent=2))

          modules={
              'calibration':['AsianCup','KingCar','GeneralTemplate'],
              'sweet-love':['SweetLove','Sweetlove','Love','Valentine','SweetValentine','SweetMoment','LoveChallenge','LoveStory','LoveJourney','LoveCarnival','CPLove','CPValentine','SweetDate','RomanticJourney'],
              'lucky-carnival':['LuckyCarnival','Carnival','LuckyMoment','LuckyPool','PrizePool','LuckyDraw','LuckyParty','SuperLucky','LuckyStage','LuckyShow','LuckyFestival','FortuneCarnival','HappyCarnival','RewardCarnival'],
              'treasure-tycoon':['TreasureTycoon','Treasure','Tycoon','WealthPath','TreasureHunt','LuckyTreasure','LuckyTreasureHunt','TreasurePath','PonyTreasure','WealthRoad','TreasureRoad','WealthTycoon','LuckyTycoon','TreasureAdventure','RichPath','GoldenPath'],
          }
          existence=[]
          for group,names in modules.items():
              for name in names:
                  for casing in ['api','Api']:
                      url=f'{BASE}/{casing}/{name}/Init'
                      for method in ['GET','POST','OPTIONS']:
                          kw={}
                          if method=='POST': kw['json']={}
                          row=req(method,url,**kw); row.update(group=group,module=name)
                          existence.append(row)
                          time.sleep(.08)
          (OUT/'route-existence.json').write_text(json.dumps(existence,indent=2))

          # Existing routes are anything that does not look like a plain 404/405 generated by missing route.
          existing=[]
          for r in existence:
              if r.get('status') in (200,204,400,401,403,422,500) or (r.get('status')==405 and r.get('allow')):
                  existing.append(r)
          (OUT/'existing-routes.json').write_text(json.dumps(existing,indent=2))

          # Calibrate with known live route and target route candidates using signed guest-like common params.
          target_ids={
              'AsianCup':'240112',
              'KingCar':'260811',
              'GeneralTemplate':'240815',
              'SweetLove':'240207','Love':'240207','Valentine':'240207','SweetValentine':'240207','SweetMoment':'240207','LoveChallenge':'240207',
              'LuckyCarnival':'241022','Carnival':'241022','LuckyMoment':'241022','LuckyPool':'241022','PrizePool':'241022','LuckyDraw':'241022',
              'TreasureTycoon':'260805','Treasure':'260805','Tycoon':'260805','WealthPath':'260805','TreasureHunt':'260805','LuckyTreasure':'260805','TreasurePath':'260805','PonyTreasure':'260805',
          }
          candidate_modules=sorted(set(target_ids))
          combos=[]
          # Purposefully small matrix; enough to identify which common parameter is mandatory without hammering the endpoint.
          for region,user_id,token,v,sval in [
              ('0','','','', ''),('0','0','','999','3'),('1','0','','999','3'),('5','0','','999','3'),
              ('0','','','222','3'),('0','0','','222','2'),('0','undefined','undefined','999','3'),
              ('1','','','999','3'),('0','0','','1000','1')
          ]:
              combos.append((region,user_id,token,v,sval))
          signed=[]
          for module in candidate_modules:
              activity_id=target_ids[module]
              for region,user_id,token,v,sval in combos:
                  ts=str(int(time.time()*1000))
                  sig=sign(token,ts)
                  common={'region':region,'userId':user_id,'token':token,'v':v,'s':sval,'activityId':activity_id,'xtimestamp':ts,'xsignature':sig}
                  headers={k:str(val) for k,val in common.items()}
                  headers['Content-Type']='application/json'
                  for casing in ['api','Api']:
                      url=f'{BASE}/{casing}/{module}/Init'
                      # GET query and POST JSON, matching observed Yalla H5 patterns.
                      row=req('GET',url,params=common,headers=headers); row.update(module=module,activity_id=activity_id,params=common,transport='get')
                      signed.append(row)
                      row2=req('POST',url,json=common,headers=headers); row2.update(module=module,activity_id=activity_id,params=common,transport='post-json')
                      signed.append(row2)
                  time.sleep(.12)
          (OUT/'signed-probes.json').write_text(json.dumps(signed,indent=2))

          interesting=[]
          for r in signed:
              body=(r.get('body') or '').lower()
              if r.get('status') not in (404,405) and not (r.get('status')==400 and 'bad request' in body and len(body)<300):
                  interesting.append(r)
              elif r.get('status') in (200,204): interesting.append(r)
          (OUT/'interesting-signed.json').write_text(json.dumps(interesting,indent=2))

          report=['# Yalla target API route scan','',f'Route checks: {len(existence)}',f'Existing/non-404 route responses: {len(existing)}',f'Signed probes: {len(signed)}',f'Interesting signed responses: {len(interesting)}','']
          for group in modules:
              hits=sorted({r['module'] for r in existing if r.get('group')==group})
              report += [f'## {group}','',('Existing modules: '+', '.join(hits)) if hits else 'No route-level hits.','']
          if interesting:
              report += ['## Interesting signed responses','']
              for r in interesting[:100]: report += [f"- {r.get('status')} {r.get('transport')} `{r.get('url')}` activityId={r.get('activity_id')} body={repr((r.get('body') or '')[:240])}"]
          (OUT/'REPORT.md').write_text('\n'.join(report))
          PY
          python /tmp/scan.py

      - name: Add report to summary
        if: always()
        run: test -f artifacts/pro-yalla-target-api-scan/REPORT.md && cat artifacts/pro-yalla-target-api-scan/REPORT.md >> "$GITHUB_STEP_SUMMARY" || true

      - name: Upload route scan
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pro-yalla-target-api-route-scan
          path: artifacts/pro-yalla-target-api-scan
          if-no-files-found: error
          retention-days: 14
