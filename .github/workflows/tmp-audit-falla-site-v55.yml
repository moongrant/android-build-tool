name: Temporary Falla Sites live hierarchy audit

on:
  pull_request:
    branches:
      - main
    paths:
      - 'tools/audit-falla-site.mjs'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit-falla-site-v55-20260819
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright
        run: |
          npm install playwright@1.54.2 --no-save
          npx playwright install --with-deps chromium
      - name: Audit deployed Site
        env:
          OUT_DIR: ${{ github.workspace }}/audit-output
        run: |
          node --check tools/audit-falla-site.mjs
          node tools/audit-falla-site.mjs
      - name: Print summary
        if: always()
        run: |
          cat audit-output/AUDIT.md >> "$GITHUB_STEP_SUMMARY" || true
          find audit-output -maxdepth 2 -type f -printf '%p %s bytes\n' | sort || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: falla-site-v55-live-audit
          path: audit-output
          if-no-files-found: error
          retention-days: 7
          compression-level: 6
