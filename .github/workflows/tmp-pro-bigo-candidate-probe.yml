name: Temporary Pro-BIGO Candidate Probe

on:
  push:
    branches:
      - main
    paths:
      - 'tools/pro-bigo/**'
      - '.github/workflows/tmp-pro-bigo-candidate-probe.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser runtime
        run: |
          npm init -y
          npm install playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Probe candidate pages
        run: node tools/pro-bigo/probe-candidates.mjs
      - name: Upload candidate probe
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pro-bigo-candidate-probe
          path: pro-bigo-candidate-probe-output
          if-no-files-found: error
          compression-level: 5
          retention-days: 14
      - name: Publish stable candidate probe branch
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/pro-bigo-candidate-probe-results
          mkdir -p /tmp/pro-bigo-candidate-probe-results
          if [ -d pro-bigo-candidate-probe-output ]; then cp -R pro-bigo-candidate-probe-output/. /tmp/pro-bigo-candidate-probe-results/; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+moongrant@users.noreply.github.com"
          git checkout --orphan pro-bigo-candidate-probe-results-tmp
          git rm -rf . >/dev/null 2>&1 || true
          find . -mindepth 1 -maxdepth 1 -not -name .git -exec rm -rf {} +
          cp -R /tmp/pro-bigo-candidate-probe-results/. .
          printf '# Pro-BIGO candidate probe results\n' > README.md
          git add -A
          git commit -m "Update Pro-BIGO candidate probe results"
          git push origin HEAD:pro-bigo-candidate-probe-results --force
