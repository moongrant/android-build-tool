name: Temporary Pro-BIGO Rich Scan

on:
  push:
    branches:
      - main
    paths:
      - 'tools/pro-bigo/**'
      - '.github/workflows/tmp-pro-bigo-rich-scan.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scan:
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: icon-2025
            start: 66500
            end: 72050
          - label: christmas-2025
            start: 77200
            end: 79080
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Scan activity configuration range
        run: node tools/pro-bigo/scan.mjs '${{ matrix.label }}' '${{ matrix.start }}' '${{ matrix.end }}'
      - name: Upload scan result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pro-bigo-scan-${{ matrix.label }}
          path: pro-bigo-scan-${{ matrix.label }}
          if-no-files-found: error
          compression-level: 6
          retention-days: 14

  publish:
    if: always()
    needs:
      - scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Download all scan artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: pro-bigo-scan-*
          path: /tmp/pro-bigo-rich-scan-results
      - name: Build compact candidate summaries
        shell: bash
        run: |
          python - <<'PY'
          import json
          import re
          from pathlib import Path

          root = Path('/tmp/pro-bigo-rich-scan-results')
          strict_name = re.compile(
              r'christmas|new year|xmas|wishing|wish pool|blind box|red packet|firework|tree|'
              r'bigo icon|icon 2025|pageant|crown|talent showcase|annual festival|festival award',
              re.I,
          )
          for source in root.glob('*/valid-activities.json'):
              rows = json.loads(source.read_text())
              label = source.parent.name
              compact = []
              for row in rows:
                  name = str(row.get('name') or '')
                  dedicated = row.get('dedicatedUrls') or []
                  start = str(row.get('startTime') or '')
                  in_date_window = False
                  if 'christmas' in label:
                      in_date_window = ('2025-12-' in start or '2026-01-' in start)
                  elif 'icon' in label:
                      in_date_window = ('2025-06-' in start or '2025-07-' in start or '2025-08-' in start)
                  if strict_name.search(name) or dedicated or in_date_window:
                      compact.append({
                          'id': row.get('id'),
                          'name': name,
                          'startTime': row.get('startTime'),
                          'endTime': row.get('endTime'),
                          'moduleTypes': row.get('moduleTypes') or [],
                          'features': row.get('features') or [],
                          'featureCount': row.get('featureCount'),
                          'keywordHits': row.get('keywordHits') or [],
                          'dedicatedUrls': dedicated,
                          'score': row.get('score'),
                      })
              compact.sort(key=lambda x: (-int(x.get('score') or 0), int(x.get('id') or 0)))
              (source.parent / 'compact-candidates.json').write_text(json.dumps(compact, ensure_ascii=False, indent=2))
              with (source.parent / 'compact-candidates.tsv').open('w') as f:
                  f.write('id\tname\tstart\tend\tfeatures\tdedicated_urls\tscore\n')
                  for row in compact:
                      values = [
                          row.get('id'), row.get('name'), row.get('startTime'), row.get('endTime'),
                          ','.join(row.get('features') or []), '|'.join(row.get('dedicatedUrls') or []), row.get('score')
                      ]
                      f.write('\t'.join(str(v or '').replace('\t', ' ').replace('\n', ' ') for v in values) + '\n')
              summary_path = source.parent / 'summary.json'
              summary = json.loads(summary_path.read_text())
              summary['compactCandidateCount'] = len(compact)
              summary_path.write_text(json.dumps(summary, ensure_ascii=False, indent=2))
          PY
      - name: Publish stable result branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+moongrant@users.noreply.github.com"
          git checkout --orphan pro-bigo-rich-scan-results-tmp
          git rm -rf . >/dev/null 2>&1 || true
          find . -mindepth 1 -maxdepth 1 -not -name .git -exec rm -rf {} +
          cp -R /tmp/pro-bigo-rich-scan-results/. .
          printf '# Pro-BIGO rich scan results\n' > README.md
          git add -A
          git commit -m "Update Pro-BIGO rich scan results"
          git push origin HEAD:pro-bigo-rich-scan-results --force
