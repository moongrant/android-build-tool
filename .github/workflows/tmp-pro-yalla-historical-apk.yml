name: Temporary Pro-Yalla historical APK research

on:
  pull_request:
    branches:
      - main
    paths:
      - tools/pro-yalla-probe/trigger-apk.txt
      - .github/workflows/tmp-pro-yalla-historical-apk.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-22.04
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        version: ['2.25.1', '2.28.0', '2.29.0']
    steps:
      - uses: actions/checkout@v4

      - name: Download public historical Yalla package
        env:
          VERSION: ${{ matrix.version }}
        run: |
          set -Eeuo pipefail
          safe="${VERSION//./_}"
          out="artifacts/pro-yalla-three-rich/historical-apk/$VERSION"
          mkdir -p "$out" /tmp/apkeep-output /tmp/yalla-xapk /tmp/apks /tmp/decoded
          docker pull ghcr.io/efforg/apkeep:stable
          docker run --rm \
            -v /tmp/apkeep-output:/output \
            ghcr.io/efforg/apkeep:stable \
            -a "com.weieyu.yalla@$VERSION" -d apk-pure /output \
            > "$out/apkeep.stdout.txt" 2> "$out/apkeep.stderr.txt"
          package="$(find /tmp/apkeep-output -type f \( -name '*.xapk' -o -name '*.apks' -o -name '*.apk' \) -printf '%s %p\n' | sort -nr | head -1 | cut -d' ' -f2-)"
          test -n "$package"
          stat -c '%n %s bytes' "$package" > "$out/package.txt"
          sha256sum "$package" > "$out/package.sha256"
          if [[ "$package" == *.apk ]]; then
            cp "$package" /tmp/apks/base.apk
          else
            unzip -q "$package" -d /tmp/yalla-xapk
            find /tmp/yalla-xapk -type f -name '*.apk' -exec cp '{}' /tmp/apks/ \;
          fi
          find /tmp/apks -type f -name '*.apk' -printf '%s %f\n' | sort -nr > "$out/apk-splits.txt"
          base="$(find /tmp/apks -type f \( -name 'com.weieyu.yalla.apk' -o -name 'base.apk' \) | head -1)"
          if [[ -z "$base" ]]; then base="$(find /tmp/apks -type f -name '*.apk' -printf '%s %p\n' | sort -nr | head -1 | cut -d' ' -f2-)"; fi
          test -f "$base"
          cp "$base" /tmp/yalla-base.apk
          sha256sum /tmp/yalla-base.apk > "$out/base-apk.sha256"
          unzip -q /tmp/yalla-base.apk -d /tmp/decoded/base || true
          i=0
          for split in /tmp/apks/*.apk; do
            i=$((i+1)); mkdir -p "/tmp/decoded/split-$i"; unzip -q "$split" -d "/tmp/decoded/split-$i" || true
          done

      - name: Extract raw strings, URLs, assets, and Flutter symbols
        env:
          VERSION: ${{ matrix.version }}
        run: |
          set -Eeuo pipefail
          out="artifacts/pro-yalla-three-rich/historical-apk/$VERSION"
          find /tmp/decoded -type f -size -250M -print0 \
            | xargs -0 -r strings -a -n 4 2>/dev/null \
            | sort -u > /tmp/all-strings.txt

          grep -Eio 'https?://[^[:space:]"'"'<>\\)]+' /tmp/all-strings.txt \
            | sed 's/[),.;:]$//' | sort -u > "$out/all-urls.txt" || true
          grep -Ei 'yalla|activity|campaign|event|h5|webview|template|sweet|love|lucky|carnival|treasure|tycoon|wealth|prize.?pool|activityId|h5EntranceUrl|activityUrl|GetActivityListForCenter|Yalla-Activity-Headers|GeneralTemplate' \
            /tmp/all-strings.txt | sort -u > "$out/activity-matches.txt" || true
          grep -Ei 'activity2\.yalla\.live|activitytest2|event\.yalla\.live|/activity/|templateActivity|GeneralTemplate' \
            "$out/all-urls.txt" | sort -u > "$out/yalla-activity-urls.txt" || true

          find /tmp/decoded -type f \( -name 'AssetManifest.json' -o -name 'AssetManifest.bin' -o -name 'FontManifest.json' \) \
            -printf '%p\n' > "$out/flutter-manifests.txt" || true
          find /tmp/decoded -type f \
            | sed 's#^/tmp/decoded/##' \
            | grep -Ei 'sweet|love|lucky|carnival|treasure|tycoon|wealth|prize.?pool|activity|event|campaign' \
            | sort -u > "$out/relevant-file-paths.txt" || true

          # Preserve readable Flutter manifests and relevant text assets.
          mkdir -p "$out/manifests"
          while IFS= read -r file; do
            [[ -f "$file" ]] || continue
            safe="$(printf '%s' "${file#/tmp/decoded/}" | tr '/ ' '__')"
            cp "$file" "$out/manifests/$safe" || true
          done < "$out/flutter-manifests.txt"

          # Extract strings separately from native libraries because Flutter routes often live in libapp.so.
          find /tmp/decoded -type f \( -name 'libapp.so' -o -name 'libflutter.so' \) -print0 \
            | while IFS= read -r -d '' so; do
                safe="$(printf '%s' "${so#/tmp/decoded/}" | tr '/ ' '__')"
                strings -a -n 4 "$so" \
                  | grep -Ei 'https?://|activity|campaign|event|template|sweet|love|lucky|carnival|treasure|tycoon|wealth|prize.?pool|h5EntranceUrl|activityUrl' \
                  | sort -u > "$out/${safe}.strings.txt" || true
              done

      - name: Install JADX and decompile base APK
        env:
          VERSION: ${{ matrix.version }}
        run: |
          set -Eeuo pipefail
          out="artifacts/pro-yalla-three-rich/historical-apk/$VERSION"
          sudo apt-get update -qq
          sudo apt-get install -y -qq ripgrep
          asset_url="$(curl --fail --silent --show-error \
            -H 'Accept: application/vnd.github+json' \
            https://api.github.com/repos/skylot/jadx/releases/latest \
            | jq -r '.assets[] | select(.name | test("^jadx-[0-9].*\\.zip$")) | .browser_download_url' \
            | head -1)"
          test -n "$asset_url"
          curl --fail --location --retry 5 --retry-all-errors --output /tmp/jadx.zip "$asset_url"
          unzip -q /tmp/jadx.zip -d /tmp/jadx
          /tmp/jadx/bin/jadx --version > "$out/jadx-version.txt"
          /tmp/jadx/bin/jadx \
            --no-res \
            --threads-count 4 \
            --deobf \
            --show-bad-code \
            --output-dir /tmp/jadx-out \
            /tmp/yalla-base.apk \
            > "$out/jadx.stdout.txt" 2> "$out/jadx.stderr.txt" || true
          find /tmp/jadx-out -type f | wc -l > "$out/jadx-file-count.txt"

      - name: Extract decompiled activity-center and request-signing evidence
        env:
          VERSION: ${{ matrix.version }}
        run: |
          set -Eeuo pipefail
          out="artifacts/pro-yalla-three-rich/historical-apk/$VERSION"
          root=/tmp/jadx-out/sources
          test -d "$root"
          mkdir -p "$out/source-snippets"

          rg -n -i -C 12 \
            'Sweet Love|SweetLove|Lucky Carnival|LuckyCarnival|Treasure Tycoon|TreasureTycoon|WealthPath|PrizePool|activity2\\.yalla|templateActivity|GeneralTemplate|GetActivityListForCenter|ActivityCenterItemModel|OfficialActionModel|RoomActivityModel|h5EntranceUrl|activityUrl|Yalla-Activity-Headers' \
            "$root" > "$out/decompiled-activity-context.txt" || true

          rg -n -i -C 15 \
            'ParamsWrapper|addHeader|header\\(|authorization|token|signature|sign\\(|deviceId|userid|region|version|platform|isExploreIndex|GetActivityListForCenter' \
            "$root/com/yalla/yalla" "$root/o0OoOoo" "$root/p539o0OoOoo" 2>/dev/null \
            > "$out/request-signing-context.txt" || true

          rg -o -N 'https?://[^"'"' )]+' "$root" \
            | sed 's/[),.;:]$//' | sort -u > "$out/decompiled-urls.txt" || true
          grep -Ei 'yalla|activity|campaign|event|h5|template' "$out/decompiled-urls.txt" \
            | sort -u > "$out/decompiled-yalla-urls.txt" || true

          rg -l -i \
            'GetActivityListForCenter|ActivityCenterItemModel|OfficialActionModel|RoomActivityModel|h5EntranceUrl|activityUrl|Yalla-Activity-Headers|ParamsWrapper' \
            "$root" | sort -u > "$out/relevant-source-files.txt" || true
          i=0
          while IFS= read -r file; do
            [[ -f "$file" ]] || continue
            i=$((i+1)); [[ $i -le 120 ]] || break
            rel="${file#$root/}"; safe="$(printf '%s' "$rel" | tr '/ ' '__' | tr -cd '[:alnum:]_.-')"
            cp "$file" "$out/source-snippets/${i}-${safe}"
          done < "$out/relevant-source-files.txt"

          {
            echo "# Yalla historical APK $VERSION"
            echo
            echo "Package: $(cat "$out/package.txt")"
            echo "APK splits: $(wc -l < "$out/apk-splits.txt")"
            echo "Raw activity matches: $(wc -l < "$out/activity-matches.txt")"
            echo "Raw Yalla activity URLs: $(wc -l < "$out/yalla-activity-urls.txt")"
            echo "Decompiler files: $(cat "$out/jadx-file-count.txt")"
            echo "Relevant Java sources: $(wc -l < "$out/relevant-source-files.txt")"
            echo
            echo '## Exact target-name matches'
            echo '```'
            grep -Ei 'sweet|love|lucky|carnival|treasure|tycoon|wealth|prize.?pool' "$out/activity-matches.txt" | sed -n '1,600p' || true
            echo '```'
            echo
            echo '## Yalla H5 URLs'
            echo '```'
            sed -n '1,500p' "$out/yalla-activity-urls.txt"
            echo '```'
          } > "$out/REPORT.md"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pro-yalla-historical-apk-${{ matrix.version }}
          path: artifacts/pro-yalla-three-rich/historical-apk/${{ matrix.version }}
          if-no-files-found: warn
          compression-level: 6
          retention-days: 7
