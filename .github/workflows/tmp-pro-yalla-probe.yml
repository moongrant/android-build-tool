name: Temporary Pro-Yalla root and archive research

on:
  pull_request:
    branches:
      - main
    paths:
      - tools/pro-yalla-probe/trigger-root.txt
      - tools/pro-yalla-probe/root_probe.py
      - .github/workflows/tmp-pro-yalla-probe.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-22.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install research dependencies
        run: |
          set -Eeuo pipefail
          python -m pip install --upgrade pip
          python -m pip install aiohttp requests beautifulsoup4 playwright pillow
          python -m playwright install --with-deps chromium

      - name: Probe dedicated roots, fixed templates, archives, and public URL indexes
        env:
          PYTHONUNBUFFERED: '1'
        run: |
          set -Eeuo pipefail
          python tools/pro-yalla-probe/root_probe.py

      - name: Write summary
        if: always()
        run: |
          if [[ -f artifacts/pro-yalla-three-rich/root-probe/REPORT.md ]]; then
            cat artifacts/pro-yalla-three-rich/root-probe/REPORT.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'Probe did not produce REPORT.md.' >> "$GITHUB_STEP_SUMMARY"
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pro-yalla-three-rich-root-probe
          path: artifacts/pro-yalla-three-rich/root-probe
          if-no-files-found: warn
          compression-level: 6
          retention-days: 7
