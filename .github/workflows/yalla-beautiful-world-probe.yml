name: Yalla Beautiful World official SPA probe

on:
  push:
    branches: [main]
    paths:
      - tools/yalla-next-batch/beautiful_world_probe.py
      - .github/workflows/yalla-beautiful-world-probe.yml
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  probe:
    runs-on: ubuntu-22.04
    timeout-minutes: 100
    env:
      RESULT_BRANCH: pro-yalla-beautiful-world-probe-results
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install and run strict Beautiful World probe
        run: |
          python -m pip install requests beautifulsoup4 lxml playwright==1.55.0
          python -m playwright install --with-deps chromium
          python -m py_compile tools/yalla-next-batch/beautiful_world_probe.py
          rm -rf pro-yalla-beautiful-world-probe
          python tools/yalla-next-batch/beautiful_world_probe.py 2>&1 | tee beautiful-world-probe.log
      - name: Publish results
        if: always()
        run: |
          set -Eeuo pipefail
          stage=/tmp/beautiful-world-probe
          rm -rf "$stage" && mkdir -p "$stage"
          cp -R pro-yalla-beautiful-world-probe/. "$stage/" 2>/dev/null || true
          cp beautiful-world-probe.log "$stage/" 2>/dev/null || true
          git config user.name 'pro-yalla-probe-bot'
          git config user.email '53897102+moongrant@users.noreply.github.com'
          git switch --orphan "$RESULT_BRANCH"
          git rm -rf . >/dev/null 2>&1 || true
          cp -a "$stage"/. .
          git add .
          git commit -m "Publish Beautiful World SPA probe ${GITHUB_RUN_ID}"
          git push --force origin "$RESULT_BRANCH"
      - name: Upload artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pro-yalla-beautiful-world-probe
          path: pro-yalla-beautiful-world-probe
          if-no-files-found: warn
          compression-level: 0
          retention-days: 30
