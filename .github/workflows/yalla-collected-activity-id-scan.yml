name: Yalla collected bundle activity-ID scan

on:
  push:
    branches: [main]
    paths:
      - tools/yalla-next-batch/scan_collected_activity_ids.py
      - .github/workflows/yalla-collected-activity-id-scan.yml
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  scan:
    runs-on: ubuntu-22.04
    timeout-minutes: 180
    env:
      RESULT_BRANCH: pro-yalla-collected-activity-id-results
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Mirror collected bundles and extract every activityId
        run: |
          python -m pip install requests beautifulsoup4 lxml
          python -m py_compile tools/yalla-next-batch/scan_collected_activity_ids.py
          rm -rf pro-yalla-collected-activity-id-scan
          python tools/yalla-next-batch/scan_collected_activity_ids.py 2>&1 | tee yalla-activity-id-scan.log
      - name: Publish results
        if: always()
        run: |
          set -Eeuo pipefail
          stage=/tmp/yalla-activity-ids
          rm -rf "$stage" && mkdir -p "$stage"
          for f in REPORT.md activity-ids.json; do cp "pro-yalla-collected-activity-id-scan/$f" "$stage/" 2>/dev/null || true; done
          cp yalla-activity-id-scan.log "$stage/" 2>/dev/null || true
          git config user.name 'pro-yalla-id-bot'
          git config user.email '53897102+moongrant@users.noreply.github.com'
          git switch --orphan "$RESULT_BRANCH"
          git rm -rf . >/dev/null 2>&1 || true
          cp -a "$stage"/. .
          git add .
          git commit -m "Publish collected Yalla activity IDs ${GITHUB_RUN_ID}"
          git push --force origin "$RESULT_BRANCH"
      - name: Upload artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: yalla-collected-activity-id-scan
          path: pro-yalla-collected-activity-id-scan
          if-no-files-found: warn
          retention-days: 30
