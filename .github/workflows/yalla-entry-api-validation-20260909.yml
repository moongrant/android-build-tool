name: Yalla entry API validation 20260909
on:
  push:
    branches: [research/yalla-halloween-public-captures-20260908]
    paths: [.github/workflows/yalla-entry-api-validation-20260909.yml]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - name: Compare exact APK-declared production API origins
        shell: bash
        run: |
          mkdir -p yalla-entry-api-origins
          cat > /tmp/validate.py <<'PY'
          import datetime,hashlib,json,re,time,urllib.request,urllib.error
          from pathlib import Path
          out=Path('yalla-entry-api-origins')
          source={'archive':'yalla-activity-center-deep-source-artifact.zip','baseApkSha256':'4e8ba21c0042d40039fe1eb230d2820e1e5426e9c0cc3b950ba22e898032e2fa','class':'com.yalla.yalla.domain.OooOo00','note':'Release branch constants declare Main apiv2.windgh.com / apiv2.yalla.live and fallback apiv2.ylapi.cc. The actual active host selection is not inferred from constant ordering.'}
          def clean(x):
            if isinstance(x,dict):return {k:('[REDACTED]' if re.search(r'token|cookie|authorization|password|secret|signature|userid|deviceid',k,re.I) else clean(v)) for k,v in x.items()}
            if isinstance(x,list):return [clean(v) for v in x]
            return x
          jobs=[]
          for host in ['apiv2.windgh.com','apiv2.ylapi.cc']:
            jobs.append(('https://'+host+'/Webservers/Api/GetConfigV2','bootstrap-domain-comparison'))
            jobs.append(('https://'+host+'/Webservers/Messages/GetActivityListForCenter?isExploreIndex=0','entry-domain-comparison'))
          jobs += [('https://apiv2.yalla.live/Webservers/Api/GetConfigV2?p=2&SimCountryCode=US&DeviceCountryCode=US&isHuawei=false','source-declared-platform-only'),('https://apiv2.yalla.live/Webservers/Messages/GetActivityListForCenter?isExploreIndex=0&p=2','source-declared-platform-only')]
          rows=[]
          for i,(url,purpose) in enumerate(jobs):
            row={'url':url,'method':'GET','purpose':purpose,'credentials':'NONE','at':datetime.datetime.now(datetime.timezone.utc).isoformat()}
            try:
              req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0','Accept':'application/json,text/plain,*/*','Accept-Language':'en-US,en;q=.8'})
              try:r=urllib.request.urlopen(req,timeout=15)
              except urllib.error.HTTPError as e:r=e
              body=r.read(1000000);row.update(httpStatus=r.code,contentType=r.headers.get('content-type',''),bytes=len(body),sha256=hashlib.sha256(body).hexdigest(),finalUrl=r.url);r.close()
              try:
                d=json.loads(body);row['response']=clean(d)
                if isinstance(d,dict):row.update(businessCode=d.get('code',d.get('Code')),message=d.get('message',d.get('Message',d.get('title'))))
              except Exception:row['textSample']=body[:1200].decode('utf8','replace')
            except Exception as e:row['transportError']=str(e)
            rows.append(row);print('API_RESULT '+json.dumps(row,ensure_ascii=False),flush=True);time.sleep(.8)
          summary={'source':source,'requests':len(rows),'rows':rows,'note':'No authentication, signature generation, guest login, credentials or write endpoints. Root availability and business errors are not successful activity discovery.'}
          (out/'SUMMARY.json').write_text(json.dumps(summary,ensure_ascii=False,indent=2))
          PY
          python3 /tmp/validate.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: yalla-entry-api-origins-20260909
          path: yalla-entry-api-origins
          if-no-files-found: error
          retention-days: 14
