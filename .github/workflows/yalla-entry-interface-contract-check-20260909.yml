name: Yalla source-confirmed entry API checks 20260909
on:
  push:
    branches: [research/yalla-halloween-public-captures-20260908]
    paths: [.github/workflows/yalla-entry-interface-contract-check-20260909.yml]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-22.04
    timeout-minutes: 8
    steps:
      - name: Check only source-confirmed public read endpoints
        shell: bash
        run: |
          mkdir -p yalla-entry-interface-check-20260909
          cat > /tmp/check.py <<'PY'
          import hashlib,json,time,urllib.request,urllib.error,urllib.parse
          from pathlib import Path
          OUT=Path('yalla-entry-interface-check-20260909'); (OUT/'responses').mkdir(exist_ok=True)
          jobs=[
            ('activity-center-0','https://apiv2.yalla.live/Webservers/Messages/GetActivityListForCenter?isExploreIndex=0','APK ActivityCenterRepo.kt explicitly calls this GET with isExploreIndex'),
            ('activity-center-1','https://apiv2.yalla.live/Webservers/Messages/GetActivityListForCenter?isExploreIndex=1','APK ActivityCenterRepo.kt explicitly calls this GET with isExploreIndex'),
            ('login-bootstrap-config','https://apiv2.yalla.live/Webservers/Api/GetConfigV2?SimCountryCode=&DeviceCountryCode=&isHuawei=false','APK LoginRepo.loadLoginConfig: country fields intentionally empty; no fabricated user or device identity'),
            ('h5-domain-discovery','https://activity2.yalla.live/api/Buried/GetDomainV2?region=0','Original 10thAnniversary main bundle declares GET endpoint'),
            ('h5-copywriting-discovery','https://activity2.yalla.live/api/Buried/GetCopywritingAddress?region=0','Original 10thAnniversary main bundle declares GET endpoint'),
            ('known-child-config','https://activity2.yalla.live/api/RamadanBless/GetActivityInfo?activityId=260212&region=0','Child SPA and ID from original parent link; route availability to be checked, not assumed'),
            ('original-template-html','https://activity2.yalla.live/activity/2024dist/templateActivity/','Original generic engine control; not an activity list'),
          ]
          # No login, no credential/signature fabrication, no writes, no ID enumeration.
          rows=[]
          for label,url,basis in jobs:
            row={'id':label,'url':url,'method':'GET','basis':basis,'credentialState':'none','testedAt':time.strftime('%Y-%m-%dT%H:%M:%SZ',time.gmtime())}
            req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0','Accept':'application/json,text/html;q=0.8,*/*;q=0.5','Accept-Language':'en-US,en;q=0.9'})
            try:
              try: response=urllib.request.urlopen(req,timeout=20)
              except urllib.error.HTTPError as e: response=e
              with response:
                body=response.read(2_000_001)
                row.update(httpStatus=response.code,finalUrl=response.geturl(),contentType=response.headers.get('Content-Type',''),bytes=len(body))
              digest=hashlib.sha256(body).hexdigest();file='responses/'+label+'.body';(OUT/file).write_bytes(body);row.update(sha256=digest,file=file)
              try:
                obj=json.loads(body);row['responseJson']=obj
                if isinstance(obj,dict):
                  row.update(businessCode=obj.get('code',obj.get('Code')),businessMessage=obj.get('message',obj.get('Message')),hasData=obj.get('data') is not None)
                  row['successNotInferredFromHttp200']=True
                else:row['responseShape']=type(obj).__name__
              except Exception:row['textPreview']=body[:1200].decode('utf-8','replace')
            except Exception as e:row['transportError']=str(e)
            rows.append(row);print(json.dumps(row,ensure_ascii=False),flush=True);time.sleep(1)
          (OUT/'endpoint-checks.json').write_text(json.dumps(rows,ensure_ascii=False,indent=2),encoding='utf8')
          summary={'checked':len(rows),'responses':sum('httpStatus' in r for r in rows),'http200':sum(r.get('httpStatus')==200 for r in rows),'entryListSuccessfullyReturned':False,'note':'Read-only checks; code 101/null, HTTP 400, errors and generic HTML are not successful discovery. No historical campaign or successful fixture is manufactured.'}
          (OUT/'SUMMARY.json').write_text(json.dumps(summary,indent=2));print(json.dumps(summary))
          PY
          python /tmp/check.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: yalla-entry-interface-check-20260909
          path: yalla-entry-interface-check-20260909
          if-no-files-found: error
          retention-days: 14
