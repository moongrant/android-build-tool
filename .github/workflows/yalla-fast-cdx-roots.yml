name: Yalla fast HTML-only CDX root discovery

on:
  push:
    branches: [main]
    paths:
      - tools/yalla-next-batch/fast_cdx_roots.py
      - .github/workflows/yalla-fast-cdx-roots.yml
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  discover:
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    env:
      RESULT_BRANCH: pro-yalla-fast-cdx-results
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run fast CDX discovery
        run: |
          python -m pip install requests beautifulsoup4 lxml
          python -m py_compile tools/yalla-next-batch/fast_cdx_roots.py
          rm -rf pro-yalla-fast-cdx-roots
          python tools/yalla-next-batch/fast_cdx_roots.py 2>&1 | tee yalla-fast-cdx.log
      - name: Publish results
        if: always()
        run: |
          set -Eeuo pipefail
          stage=/tmp/yalla-fast-cdx
          rm -rf "$stage" && mkdir -p "$stage"
          for f in REPORT.md root-list.json inspected.json eligible.json; do cp "pro-yalla-fast-cdx-roots/$f" "$stage/" 2>/dev/null || true; done
          cp yalla-fast-cdx.log "$stage/" 2>/dev/null || true
          git config user.name 'pro-yalla-cdx-bot'
          git config user.email '53897102+moongrant@users.noreply.github.com'
          git switch --orphan "$RESULT_BRANCH"
          git rm -rf . >/dev/null 2>&1 || true
          cp -a "$stage"/. .
          git add .
          git commit -m "Publish fast Yalla CDX roots ${GITHUB_RUN_ID}"
          git push --force origin "$RESULT_BRANCH"
      - name: Upload artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pro-yalla-fast-cdx-roots
          path: pro-yalla-fast-cdx-roots
          if-no-files-found: warn
          retention-days: 30
