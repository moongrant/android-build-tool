name: Yalla File CDN campaign inventory

on:
  push:
    branches: [main]
    paths:
      - tools/yalla-next-batch/file_cdn_inventory.py
      - .github/workflows/yalla-file-cdn-inventory.yml
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  inventory:
    runs-on: ubuntu-22.04
    timeout-minutes: 180
    env:
      RESULT_BRANCH: pro-yalla-file-cdn-inventory-results
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run Common Crawl CDN folder inventory
        run: |
          python -m pip install requests
          python -m py_compile tools/yalla-next-batch/file_cdn_inventory.py
          rm -rf pro-yalla-file-cdn-inventory
          python tools/yalla-next-batch/file_cdn_inventory.py 2>&1 | tee yalla-file-cdn-inventory.log
      - name: Publish compact inventory branch
        if: always()
        run: |
          set -Eeuo pipefail
          stage=/tmp/yalla-file-cdn-inventory
          rm -rf "$stage" && mkdir -p "$stage"
          for f in REPORT.md indexes.json record-count.txt folders.json credible-live-roots.json live-probes.json; do
            cp "pro-yalla-file-cdn-inventory/$f" "$stage/" 2>/dev/null || true
          done
          cp yalla-file-cdn-inventory.log "$stage/" 2>/dev/null || true
          git config user.name 'pro-yalla-cdn-bot'
          git config user.email '53897102+moongrant@users.noreply.github.com'
          git switch --orphan "$RESULT_BRANCH"
          git rm -rf . >/dev/null 2>&1 || true
          cp -a "$stage"/. .
          git add .
          git commit -m "Publish Yalla file CDN inventory ${GITHUB_RUN_ID}"
          git push --force origin "$RESULT_BRANCH"
      - name: Upload inventory artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pro-yalla-file-cdn-inventory
          path: pro-yalla-file-cdn-inventory
          if-no-files-found: warn
          compression-level: 0
          retention-days: 30
