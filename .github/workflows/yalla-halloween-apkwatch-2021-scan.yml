name: Yalla Halloween APKWatch 2021 exact scan

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/yalla-halloween-apkwatch-2021-scan.yml
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  scan:
    runs-on: ubuntu-22.04
    timeout-minutes: 180
    env:
      RESULT_BRANCH: pro-yalla-halloween-apkwatch-2021-results
      OUT_DIR: artifacts/yalla-halloween-apkwatch-2021
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install browser and scanner dependencies
        run: |
          set -Eeuo pipefail
          python -m pip install playwright==1.55.0 requests beautifulsoup4 lxml
          python -m playwright install --with-deps chromium
          mkdir -p "$OUT_DIR" /tmp/yalla-apkwatch

      - name: Resolve APKWatch downloads and scan Halloween-window builds
        run: |
          set -Eeuo pipefail
          cat > /tmp/run.py <<'PY'
          from __future__ import annotations
          import asyncio, hashlib, json, os, re, shutil, subprocess, urllib.parse, zipfile
          from pathlib import Path
          from playwright.async_api import async_playwright

          OUT=Path(os.environ['OUT_DIR']);TMP=Path('/tmp/yalla-apkwatch');OUT.mkdir(parents=True,exist_ok=True);TMP.mkdir(parents=True,exist_ok=True)
          targets={
            '2.11.16':'https://yalla-free-voice-chat-rooms.apk.watch/2.11.16',
            '2.12.0':'https://yalla-free-voice-chat-rooms.apk.watch/2.12.0',
            '2.12.1':'https://yalla-free-voice-chat-rooms.apk.watch/2.12.1',
          }
          TERMS=['halloween','هالوين','cadılar bayramı','cadilar bayrami','dia das bruxas','noche de brujas','pumpkin','pumpkins','اليقطين','قرع','balkabağı','balkabagi','abóbora','abobora','calabaza','citrouille','trick or treat','trick-or-treat','خدعة أم حلوى','ghost','ghosts','شبح','أشباح','hayalet','fantasma','fantôme','fantome','witch','witches','ساحرة','ساحر','cadı','cadi','bruxa','bruja','sorcière','sorciere','candy','candies','حلوى','şeker','seker','doces','dulces','bonbon','haunted','مسكون','perili','assombrado','embrujado','hanté','hante','spooky','مخيف','skeleton','هيكل عظمي','zombie','vampire']
          STRONG={x.casefold() for x in ['halloween','هالوين','cadılar bayramı','cadilar bayrami','dia das bruxas','noche de brujas','pumpkin','pumpkins','اليقطين','قرع','balkabağı','balkabagi','abóbora','abobora','calabaza','citrouille','trick or treat','trick-or-treat','خدعة أم حلوى']}
          ALIASES=['horror night','night of fear','spooky night','ghost night','monster party','costume party','haunted house','magic castle','candy party','nightmare carnival','ليلة الرعب','ليلة الهلع','ليلة الأشباح','ليلة الوحوش','حفلة تنكرية','بيت الرعب','قصر الأشباح','مدينة الأشباح','مهرجان الأشباح','korku gecesi','korku evi','hayalet gecesi','canavar partisi','noite do terror','casa assombrada','noche de terror','fiesta de disfraces','casa embrujada']
          H5=['activity2.','file.yalla.live/activity/','/activity/','activityid','campaignid','eventid','jumpurl','shareurl','redirecturl','h5entranceurl','activityurl','templateactivity','webview']
          URL_RE=re.compile(r'https?://[^\s\"\'<>\\)]+',re.I)
          LATIN={x for x in TERMS+ALIASES if re.fullmatch(r'[A-Za-z][A-Za-z \-\'’]*',x)}
          def hits(text, values):
              low=text.casefold();out=[]
              for term in values:
                  t=term.casefold()
                  if term in LATIN:
                      if re.search(r'(?<![a-z])'+re.escape(t)+r'(?![a-z])',low):out.append(term)
                  elif t in low:out.append(term)
              return out
          def dump(path,obj): path.parent.mkdir(parents=True,exist_ok=True);path.write_text(json.dumps(obj,ensure_ascii=False,indent=2),encoding='utf-8')
          def strings_all(path):
              blocks=[]
              for cmd in (['strings','-a','-n','4'],['strings','-a','-el','-n','4'],['strings','-a','-eb','-n','4']):
                  try:p=subprocess.run(cmd+[str(path)],stdout=subprocess.PIPE,stderr=subprocess.DEVNULL,timeout=120);blocks.append(p.stdout.decode('utf-8','ignore'))
                  except Exception:pass
              return '\n'.join(blocks)

          async def download(version,url):
              folder=OUT/version;folder.mkdir(parents=True,exist_ok=True);apk=TMP/f'yalla-{version}.apk';trace=[];saved=None
              async with async_playwright() as p:
                  browser=await p.chromium.launch(headless=True,args=['--no-sandbox','--disable-dev-shm-usage'])
                  context=await browser.new_context(accept_downloads=True,viewport={'width':390,'height':844},is_mobile=True,has_touch=True,locale='en-US',user_agent='Mozilla/5.0 (Linux; Android 12; Pixel 5) AppleWebKit/537.36 Chrome/127 Mobile Safari/537.36')
                  page=await context.new_page()
                  page.on('request',lambda req: trace.append({'kind':'request','method':req.method,'url':req.url,'type':req.resource_type}) if re.search(r'apk\.watch|download|\.apk(?:\?|$)|\.xapk|\.apks',req.url,re.I) else None)
                  async def on_response(res):
                      h=await res.all_headers();
                      if re.search(r'apk\.watch|download|\.apk(?:\?|$)|\.xapk|\.apks',res.url,re.I) or re.search(r'android|octet-stream|zip',h.get('content-type',''),re.I):trace.append({'kind':'response','url':res.url,'status':res.status,'headers':h})
                  page.on('response',lambda res:asyncio.create_task(on_response(res)))
                  try:await page.goto(url,wait_until='domcontentloaded',timeout=90000);await page.wait_for_timeout(7000)
                  except Exception as e:trace.append({'kind':'navigation-error','error':repr(e)})
                  (folder/'page.html').write_text(await page.content(),encoding='utf-8');await page.screenshot(path=str(folder/'page.png'),full_page=True)
                  inv=await page.evaluate("""()=>({url:location.href,title:document.title,body:(document.body?.innerText||'').replace(/\s+/g,' ').trim().slice(0,30000),links:[...document.querySelectorAll('a[href]')].map((a,i)=>({i,text:(a.innerText||a.getAttribute('aria-label')||'').replace(/\s+/g,' ').trim(),href:a.href,html:a.outerHTML.slice(0,3000)})),buttons:[...document.querySelectorAll('button,input[type=button],input[type=submit],[role=button]')].map((b,i)=>({i,text:(b.innerText||b.value||b.getAttribute('aria-label')||'').replace(/\s+/g,' ').trim(),html:b.outerHTML.slice(0,3000)})),forms:[...document.forms].map((f,i)=>({i,action:f.action,method:f.method,html:f.outerHTML.slice(0,6000)})),scripts:[...document.scripts].map(s=>s.src||s.textContent||'').filter(Boolean).map(x=>x.slice(0,30000))})""")
                  dump(folder/'inventory.json',inv)
                  candidates=[]
                  for item in inv['links']:
                      if re.search(r'download|\.apk(?:\?|$)|\.xapk|\.apks|file',item['text']+' '+item['href']+' '+item['html'],re.I): candidates.append(item['href'])
                  for s in inv['scripts']:
                      candidates.extend(re.findall(r'https?://[^\s"\'<>]+',s))
                  candidates.extend(x.get('url') for x in trace if x.get('url'))
                  ded=[]
                  for u in candidates:
                      if u and re.search(r'apk\.watch|download|\.apk(?:\?|$)|\.xapk|\.apks|file',u,re.I) and u not in ded:ded.append(u)
                  dump(folder/'url-candidates.json',ded)
                  # Click candidates first.
                  locators=page.locator('a,button,input[type=button],input[type=submit],[role=button]')
                  count=await locators.count()
                  for i in range(count):
                      if saved:break
                      loc=locators.nth(i)
                      text=(await loc.inner_text().catch(lambda:'')) if False else ''
                      html=await loc.evaluate('(n)=>n.outerHTML').catch(lambda:'') if False else ''
                      try:
                          outer=await loc.evaluate('(n)=>n.outerHTML');label=(await loc.get_attribute('aria-label') or '')+' '+outer
                      except Exception:continue
                      if not re.search(r'download|apk',label,re.I):continue
                      try:
                          async with page.expect_download(timeout=15000) as info:await loc.click(force=True,timeout=10000)
                          dl=await info.value;await dl.save_as(str(apk));saved={'source':'download-event','url':dl.url,'suggested':dl.suggested_filename,'bytes':apk.stat().st_size};break
                      except Exception as e:trace.append({'kind':'click-error','index':i,'error':repr(e)})
                  if not saved:
                      for u in ded:
                          try:
                              res=await context.request.get(u,headers={'Referer':url},timeout=90000);body=await res.body();trace.append({'kind':'fetch','url':u,'status':res.status,'bytes':len(body),'headers':res.headers,'first':body[:30].hex()})
                              if res.ok and len(body)>30_000_000 and body[:2]==b'PK':apk.write_bytes(body);saved={'source':'fetch','url':u,'bytes':len(body)};break
                          except Exception as e:trace.append({'kind':'fetch-error','url':u,'error':repr(e)})
                  await browser.close()
              dump(folder/'trace.json',{'saved':saved,'trace':trace});return apk if saved and apk.exists() else None

          def scan(version,apk):
              folder=OUT/version;result={'version':version,'downloaded':bool(apk and apk.exists() and zipfile.is_zipfile(apk)),'apkBytes':apk.stat().st_size if apk and apk.exists() else 0,'apkSha256':hashlib.sha256(apk.read_bytes()).hexdigest() if apk and apk.exists() else None,'filesScanned':0,'raw':[],'meaningful':[],'aliases':[],'pathMatches':[],'h5Contexts':[],'activityUrls':[]}
              if not result['downloaded']:return result
              dec=TMP/f'decoded-{version}';shutil.rmtree(dec,ignore_errors=True);dec.mkdir(parents=True);zipfile.ZipFile(apk).extractall(dec);urls=set()
              for path in dec.rglob('*'):
                  if not path.is_file() or path.stat().st_size>280_000_000:continue
                  result['filesScanned']+=1;rel=path.relative_to(dec).as_posix();ph=hits(rel,TERMS+ALIASES)
                  if ph:result['pathMatches'].append({'file':rel,'terms':ph})
                  text=strings_all(path)
                  if not text:continue
                  lines=text.splitlines()
                  for i,line in enumerate(lines):
                      hh=hits(line,TERMS);aa=hits(line,ALIASES)
                      if hh or aa:
                          ctx='\n'.join(lines[max(0,i-8):min(len(lines),i+9)])[:18000];adj=any(sig in ctx.casefold() for sig in H5);item={'file':rel,'line':line[:4000],'terms':hh or aa,'activityAdjacent':adj,'context':ctx}
                          if hh:result['raw'].append(item)
                          if aa:result['aliases'].append(item)
                          if adj or (hh and bool({x.casefold() for x in hh}&STRONG)) or len(set(hh+aa))>=2:result['meaningful'].append(item)
                      if any(sig in line.casefold() for sig in H5):result['h5Contexts'].append({'file':rel,'line':line[:4000],'context':'\n'.join(lines[max(0,i-4):min(len(lines),i+5)])[:12000]})
                      for u in URL_RE.findall(line):
                          u=u.rstrip(',.;:)]}')
                          if any(sig in u.casefold() for sig in H5) or hits(u,TERMS+ALIASES):urls.add(u)
              result['activityUrls']=sorted(urls);shutil.rmtree(dec,ignore_errors=True);return result

          async def main():
              results=[]
              for version,url in targets.items():
                  apk=await download(version,url);result=scan(version,apk);dump(OUT/version/'result.json',result);results.append(result)
              summary={'results':results,'downloaded':sum(x['downloaded'] for x in results),'meaningful':sum(len(x['meaningful']) for x in results),'activityUrls':sorted({u for x in results for u in x['activityUrls']})};dump(OUT/'summary.json',summary)
              lines=['# Yalla Halloween APKWatch 2021 Exact Scan','',f"- Requested: {len(results)}",f"- Downloaded: {summary['downloaded']}",f"- Meaningful Halloween matches: {summary['meaningful']}",f"- H5/activity URLs: {len(summary['activityUrls'])}",'','| Version | Downloaded | APK bytes | Files | Raw | Aliases | Meaningful | H5 URLs |','|---|---|---:|---:|---:|---:|---:|---:|']
              for x in results:lines.append(f"| {x['version']} | {x['downloaded']} | {x['apkBytes']} | {x['filesScanned']} | {len(x['raw'])} | {len(x['aliases'])} | {len(x['meaningful'])} | {len(x['activityUrls'])} |")
              for x in results:
                  lines += ['',f"## {x['version']}",'']
                  for m in x['meaningful'][:160]:lines += [f"### `{m['file']}` · {', '.join(m['terms'])}",'```',m['context'][:6000],'```','']
              lines += ['## H5/activity URLs','']+[f'- `{u}`' for u in summary['activityUrls']]
              (OUT/'REPORT.md').write_text('\n'.join(lines),encoding='utf-8')
              print(json.dumps({'downloaded':summary['downloaded'],'meaningful':summary['meaningful'],'urls':len(summary['activityUrls'])},ensure_ascii=False,indent=2))
          asyncio.run(main())
          PY
          OUT_DIR="$OUT_DIR" python /tmp/run.py 2>&1 | tee "$OUT_DIR/run.log"

      - name: Publish compact scan
        if: always()
        run: |
          set -Eeuo pipefail
          stage=/tmp/yalla-halloween-apkwatch-public
          rm -rf "$stage" && mkdir -p "$stage"
          for f in REPORT.md summary.json run.log; do cp "$OUT_DIR/$f" "$stage/" 2>/dev/null || true; done
          for version in 2.11.16 2.12.0 2.12.1; do
            mkdir -p "$stage/$version"
            for f in result.json inventory.json url-candidates.json trace.json page.png; do cp "$OUT_DIR/$version/$f" "$stage/$version/" 2>/dev/null || true; done
          done
          git config user.name 'pro-yalla-halloween-bot'
          git config user.email '53897102+moongrant@users.noreply.github.com'
          git switch --orphan "$RESULT_BRANCH"
          git rm -rf . >/dev/null 2>&1 || true
          cp -a "$stage"/. .
          git add .
          git commit -m "Publish Yalla APKWatch Halloween scan ${GITHUB_RUN_ID}"
          git push --force origin "$RESULT_BRANCH"

      - name: Upload full APKWatch scan artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: yalla-halloween-apkwatch-2021
          path: ${{ env.OUT_DIR }}
          if-no-files-found: warn
          compression-level: 6
          retention-days: 30
