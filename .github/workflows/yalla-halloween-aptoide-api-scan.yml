name: Yalla Halloween Aptoide API historical scan

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/yalla-halloween-aptoide-api-scan.yml
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  scan:
    runs-on: ubuntu-22.04
    timeout-minutes: 300
    env:
      RESULT_BRANCH: pro-yalla-halloween-aptoide-results
      OUT_DIR: artifacts/yalla-halloween-aptoide
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Enumerate public Aptoide versions, download October-window builds, and scan
        run: |
          set -Eeuo pipefail
          python -m pip install requests
          mkdir -p "$OUT_DIR" /tmp/yalla-aptoide
          cat > /tmp/aptoide_scan.py <<'PY'
          from __future__ import annotations
          import hashlib, json, os, re, shutil, subprocess, time, zipfile
          from pathlib import Path
          import requests

          OUT=Path(os.environ['OUT_DIR']);TMP=Path('/tmp/yalla-aptoide')
          SESSION=requests.Session();SESSION.headers.update({'User-Agent':'Mozilla/5.0 Chrome/127 Safari/537.36','Accept':'application/json,text/plain,*/*'})
          API='https://ws2.aptoide.com/api/7/app/getMeta'
          PACKAGE='com.weieyu.yalla'
          TARGET_NAMES={'2.11.8.1','2.11.9','2.11.10','2.12.0','2.17.0','2.17.1','2.18.0','2.18.1','2.20.1','2.23.0','2.23.2'}
          TERMS=['halloween','هالوين','cadılar bayramı','cadilar bayrami','dia das bruxas','noche de brujas','pumpkin','pumpkins','اليقطين','قرع','balkabağı','balkabagi','abóbora','abobora','calabaza','citrouille','trick or treat','trick-or-treat','خدعة أم حلوى','ghost','ghosts','شبح','أشباح','hayalet','fantasma','fantôme','fantome','witch','witches','ساحرة','ساحر','cadı','cadi','bruxa','bruja','sorcière','sorciere','candy','candies','حلوى','şeker','seker','doces','dulces','bonbon','haunted','مسكون','perili','assombrado','embrujado','hanté','hante','spooky','مخيف','seram','skeleton','هيكل عظمي','zombie','vampire']
          STRONG={x.casefold() for x in ['halloween','هالوين','cadılar bayramı','cadilar bayrami','dia das bruxas','noche de brujas','pumpkin','pumpkins','اليقطين','قرع','balkabağı','balkabagi','abóbora','abobora','calabaza','citrouille','trick or treat','trick-or-treat','خدعة أم حلوى']}
          H5=['activity2.','file.yalla.live/activity/','/activity/','activityid','campaignid','eventid','jumpurl','shareurl','redirecturl','h5entranceurl','activityurl','templateactivity','webview']
          URL_RE=re.compile(r'https?://[^\s\"\'<>\\)]+',re.I)
          LATIN={x for x in TERMS if re.fullmatch(r'[A-Za-z][A-Za-z -]*',x)}

          def dump(path,obj):path.parent.mkdir(parents=True,exist_ok=True);path.write_text(json.dumps(obj,ensure_ascii=False,indent=2),encoding='utf-8')
          def term_hits(text):
            low=text.casefold();hits=[]
            for term in TERMS:
              t=term.casefold()
              if term in LATIN:
                if re.search(r'(?<![A-Za-z])'+re.escape(t)+r'(?![A-Za-z])',low):hits.append(term)
              elif t in low:hits.append(term)
            return hits
          def api(max_vercode=None):
            url=f'{API}/package_name={PACKAGE}'
            if max_vercode is not None:url+=f'/max_vercode={max_vercode}'
            r=SESSION.get(url,timeout=(15,90));row={'url':url,'status':r.status_code,'bytes':len(r.content)}
            try:payload=r.json()
            except Exception:return row,None
            row['infoStatus']=(payload.get('info') or {}).get('status')
            return row,payload
          def extract(payload):
            data=(payload or {}).get('data') or {}
            file=data.get('file') or {}
            if not file.get('vercode'):return None
            return {'appId':data.get('id'),'name':data.get('name'),'package':data.get('package'),'store':(data.get('store') or {}).get('name'),'vername':file.get('vername'),'vercode':int(file.get('vercode')),'md5sum':file.get('md5sum'),'filesize':file.get('filesize'),'added':file.get('added'),'path':file.get('path'),'pathAlt':file.get('path_alt'),'signatureSha1':((file.get('signature') or {}).get('sha1')),'malwareRank':((file.get('malware') or {}).get('rank'))}

          api_trace=[];versions=[];seen=set();max_code=None
          for _ in range(160):
            row,payload=api(max_code);api_trace.append(row);meta=extract(payload)
            if not meta or meta['vercode'] in seen:break
            seen.add(meta['vercode']);versions.append(meta);max_code=meta['vercode']-1
            if meta['vercode']<=1:break
            time.sleep(.12)
          dump(OUT/'api-trace.json',api_trace);dump(OUT/'versions.json',versions)

          def strings_all(path):
            blocks=[]
            for cmd in (['strings','-a','-n','4'],['strings','-a','-el','-n','4'],['strings','-a','-eb','-n','4']):
              try:
                p=subprocess.run(cmd+[str(path)],stdout=subprocess.PIPE,stderr=subprocess.DEVNULL,timeout=120);blocks.append(p.stdout.decode('utf-8','ignore'))
              except Exception:pass
            return '\n'.join(blocks)
          def scan(meta,apk):
            version=meta['vername'];decoded=TMP/f'decoded-{version}';shutil.rmtree(decoded,ignore_errors=True);decoded.mkdir(parents=True)
            with zipfile.ZipFile(apk) as z:z.extractall(decoded)
            files=0;raw=[];meaningful=[];paths=[];urls=set();h5=[]
            for path in decoded.rglob('*'):
              if not path.is_file() or path.stat().st_size>280_000_000:continue
              files+=1;rel=path.relative_to(decoded).as_posix();ph=term_hits(rel)
              if ph:paths.append({'file':rel,'terms':ph})
              text=strings_all(path)
              if not text:continue
              lines=text.splitlines()
              for i,line in enumerate(lines):
                hits=term_hits(line)
                if hits:
                  context='\n'.join(lines[max(0,i-7):min(len(lines),i+8)])[:18000];adjacent=any(sig in context.casefold() for sig in H5)
                  item={'file':rel,'line':line[:4000],'terms':hits,'strong':bool({x.casefold() for x in hits}&STRONG),'activityAdjacent':adjacent,'context':context};raw.append(item)
                  if item['strong'] or adjacent or len(hits)>=2:meaningful.append(item)
                if any(sig in line.casefold() for sig in H5):h5.append({'file':rel,'line':line[:4000],'context':'\n'.join(lines[max(0,i-4):min(len(lines),i+5)])[:12000]})
                for u in URL_RE.findall(line):
                  u=u.rstrip(',.;:)]}')
                  if any(sig in u.casefold() for sig in H5) or term_hits(u):urls.add(u)
            shutil.rmtree(decoded,ignore_errors=True)
            return {'filesScanned':files,'pathMatches':paths,'rawMatches':raw,'meaningfulMatches':meaningful,'h5Contexts':h5[:2500],'activityUrls':sorted(urls)}

          selected=[x for x in versions if x['vername'] in TARGET_NAMES]
          results=[]
          for meta in selected:
            version=meta['vername'];out=OUT/version;out.mkdir(parents=True,exist_ok=True);url=meta.get('path') or meta.get('pathAlt');trace=[]
            if not url:
              result={**meta,'downloaded':False,'error':'missing path'};dump(out/'result.json',result);results.append(result);continue
            try:
              r=SESSION.get(url,timeout=(20,360),allow_redirects=True,stream=True);trace.append({'url':url,'status':r.status_code,'finalUrl':r.url,'contentType':r.headers.get('content-type'),'contentLength':r.headers.get('content-length')})
              apk=TMP/f'yalla-{version}.apk';size=0;sha=hashlib.sha256()
              with apk.open('wb') as f:
                for chunk in r.iter_content(1024*1024):
                  if not chunk:continue
                  if size==0 and chunk[:2]!=b'PK':break
                  f.write(chunk);sha.update(chunk);size+=len(chunk)
              ok=r.status_code==200 and size>10_000_000 and zipfile.is_zipfile(apk)
            except Exception as e:trace.append({'error':repr(e)});ok=False;apk=TMP/f'yalla-{version}.apk';size=0;sha=hashlib.sha256()
            dump(out/'download-trace.json',trace)
            if not ok:
              apk.unlink(missing_ok=True);result={**meta,'downloaded':False,'trace':trace};dump(out/'result.json',result);results.append(result);continue
            result={**meta,'downloaded':True,'downloadedBytes':size,'downloadedSha256':sha.hexdigest(),'sizeMatchesMeta':not meta.get('filesize') or int(meta['filesize'])==size,**scan(meta,apk)};dump(out/'result.json',result);results.append(result);apk.unlink(missing_ok=True)
          all_urls=sorted({u for x in results for u in x.get('activityUrls',[])})
          payload={'generatedAt':__import__('datetime').datetime.now(__import__('datetime').timezone.utc).isoformat(),'enumeratedVersions':len(versions),'selectedVersions':len(selected),'downloaded':sum(bool(x.get('downloaded')) for x in results),'meaningfulMatchCount':sum(len(x.get('meaningfulMatches',[])) for x in results),'activityUrls':all_urls,'results':results};dump(OUT/'consolidated.json',payload)
          lines=['# Yalla Halloween Aptoide API Historical Scan','',f"- Enumerated versions: {payload['enumeratedVersions']}",f"- Selected Halloween-window versions: {payload['selectedVersions']}",f"- Downloaded and scanned: {payload['downloaded']}",f"- Exact/meaningful Halloween matches: {payload['meaningfulMatchCount']}",f"- H5/activity URLs: {len(all_urls)}",'', '| Version | Vercode | Added | Downloaded | APK bytes | Files | Raw exact | Meaningful | H5 URLs |','|---|---:|---|---|---:|---:|---:|---:|---:|']
          for x in results:lines.append(f"| {x.get('vername')} | {x.get('vercode')} | {x.get('added')} | {x.get('downloaded')} | {x.get('downloadedBytes',0)} | {x.get('filesScanned',0)} | {len(x.get('rawMatches',[]))} | {len(x.get('meaningfulMatches',[]))} | {len(x.get('activityUrls',[]))} |")
          for x in results:
            lines+=['',f"## {x.get('vername')} · vercode {x.get('vercode')}",'']
            for m in x.get('meaningfulMatches',[])[:160]:lines += [f"### `{m['file']}` · {', '.join(m['terms'])}",'```',m['context'][:6000],'```','']
            if x.get('activityUrls'):lines += ['### Activity URLs','']+[f'- `{u}`' for u in x['activityUrls']]
          (OUT/'REPORT.md').write_text('\n'.join(lines),encoding='utf-8')
          print(json.dumps({'enumerated':len(versions),'selected':len(selected),'downloaded':payload['downloaded'],'meaningfulMatches':payload['meaningfulMatchCount'],'activityUrls':len(all_urls),'versionNames':[x['vername'] for x in versions]},ensure_ascii=False,indent=2))
          PY
          OUT_DIR="$OUT_DIR" python /tmp/aptoide_scan.py 2>&1 | tee "$OUT_DIR/run.log"

      - name: Publish compact results
        if: always()
        run: |
          set -Eeuo pipefail
          stage=/tmp/yalla-halloween-aptoide-public
          rm -rf "$stage" && mkdir -p "$stage"
          for f in REPORT.md consolidated.json versions.json api-trace.json run.log; do cp "$OUT_DIR/$f" "$stage/" 2>/dev/null || true; done
          for d in "$OUT_DIR"/*; do
            [[ -d "$d" ]] || continue
            mkdir -p "$stage/$(basename "$d")"
            for f in result.json download-trace.json; do cp "$d/$f" "$stage/$(basename "$d")/" 2>/dev/null || true; done
          done
          git config user.name 'pro-yalla-halloween-bot'
          git config user.email '53897102+moongrant@users.noreply.github.com'
          git switch --orphan "$RESULT_BRANCH"
          git rm -rf . >/dev/null 2>&1 || true
          cp -a "$stage"/. .
          git add .
          git commit -m "Publish Yalla Halloween Aptoide API scan ${GITHUB_RUN_ID}"
          git push --force origin "$RESULT_BRANCH"

      - name: Upload scan artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: yalla-halloween-aptoide-api-scan
          path: ${{ env.OUT_DIR }}
          if-no-files-found: warn
          compression-level: 6
          retention-days: 30
