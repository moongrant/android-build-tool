name: Yalla Halloween official social archive scan

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/yalla-halloween-official-social-archive.yml
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  scan:
    runs-on: ubuntu-22.04
    timeout-minutes: 180
    env:
      RESULT_BRANCH: pro-yalla-halloween-social-results
      OUT_DIR: artifacts/yalla-halloween-social
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Scan archived official Facebook and X handles
        run: |
          set -Eeuo pipefail
          python -m pip install requests beautifulsoup4 lxml warcio
          mkdir -p "$OUT_DIR/raw"
          cat > /tmp/social_scan.py <<'PY'
          from __future__ import annotations
          import concurrent.futures, io, json, re, time
          from collections import defaultdict
          from pathlib import Path
          from urllib.parse import quote
          import requests
          from bs4 import BeautifulSoup
          from warcio.archiveiterator import ArchiveIterator

          OUT=Path('artifacts/yalla-halloween-social');RAW=OUT/'raw';RAW.mkdir(parents=True,exist_ok=True)
          S=requests.Session();S.headers.update({'User-Agent':'Mozilla/5.0 Chrome/127 Safari/537.36','Accept':'*/*'})
          HANDLES=[
            ('facebook-current','www.facebook.com/YallaVoiceChatRooms/*'),
            ('facebook-current-mobile','m.facebook.com/YallaVoiceChatRooms/*'),
            ('facebook-legacy','www.facebook.com/yalla2016/*'),
            ('facebook-legacy-mobile','m.facebook.com/yalla2016/*'),
            ('twitter-legacy','twitter.com/yalladotlive/status/*'),
            ('x-current','x.com/YallaDotLive/status/*'),
          ]
          TERMS=['halloween','هالوين','cadılar bayramı','cadilar bayrami','dia das bruxas','noche de brujas','pumpkin','اليقطين','balkabağı','balkabagi','abóbora','abobora','calabaza','ghost','شبح','hayalet','fantasma','witch','ساحرة','cadı','cadi','bruxa','bruja','candy','حلوى','şeker','seker','doces','dulces','trick or treat','خدعة أم حلوى','haunted','مسكون','spooky','مخيف','skeleton','هيكل عظمي','zombie','vampire']
          STRONG={'halloween','هالوين','cadılar bayramı','cadilar bayrami','dia das bruxas','noche de brujas','pumpkin','اليقطين','balkabağı','balkabagi','abóbora','abobora','calabaza','trick or treat','خدعة أم حلوى'}

          def get(url,timeout=(20,120),tries=3,headers=None):
            for i in range(tries):
              try:
                r=S.get(url,timeout=timeout,headers=headers,allow_redirects=True)
                if r.status_code in {429,500,502,503,504} and i+1<tries:time.sleep(1.2*(i+1));continue
                return r
              except Exception:
                if i+1<tries:time.sleep(1.2*(i+1))
            return None

          coll=get('https://index.commoncrawl.org/collinfo.json',timeout=(20,60))
          indexes=[]
          if coll and coll.status_code==200:
            by_year=defaultdict(list)
            for item in coll.json():
              m=re.search(r'CC-MAIN-(20\d{2})-',str(item.get('id','')))
              if m and 2018<=int(m.group(1))<=2025:by_year[int(m.group(1))].append(item)
            for year,items in sorted(by_year.items()):indexes.append(sorted(items,key=lambda x:x['id'],reverse=True)[0])
          (OUT/'indexes.json').write_text(json.dumps([x['id'] for x in indexes],indent=2))

          def query(index,label,pattern):
            api=index['cdx-api'];url=api+'?url='+quote(pattern,safe='')+'&matchType=prefix&output=json&filter=status:200&collapse=urlkey'
            r=get(url,timeout=(25,150),tries=2);rows=[]
            if r and r.status_code==200:
              for line in r.text.splitlines():
                try:item=json.loads(line)
                except Exception:continue
                if isinstance(item,dict):item['_index']=index['id'];item['_label']=label;rows.append(item)
            return {'index':index['id'],'label':label,'pattern':pattern,'endpoint':url,'http':r.status_code if r else None,'bytes':len(r.content) if r else 0,'rows':rows}

          queries=[]
          with concurrent.futures.ThreadPoolExecutor(max_workers=12) as ex:
            futures=[ex.submit(query,index,label,pattern) for index in indexes for label,pattern in HANDLES]
            for f in concurrent.futures.as_completed(futures):queries.append(f.result())
          rows=[]
          for query_result in queries:rows.extend(query_result['rows'])
          dedup={}
          for row in rows:dedup[(row.get('_index'),row.get('url'),row.get('timestamp'))]=row
          rows=list(dedup.values())
          (OUT/'query-summary.json').write_text(json.dumps([{k:v for k,v in q.items() if k!='rows'}|{'rowCount':len(q['rows'])} for q in queries],ensure_ascii=False,indent=2))
          (OUT/'records.json').write_text(json.dumps(rows,ensure_ascii=False,indent=2))

          def warc_body(row,max_bytes=12_000_000):
            try:
              length=int(row.get('length') or 0);offset=int(row.get('offset') or 0);filename=row.get('filename')
              if not filename or length<=0 or length>max_bytes:return None
              r=get('https://data.commoncrawl.org/'+filename,timeout=(30,150),tries=2,headers={'Range':f'bytes={offset}-{offset+length-1}'})
              if not r or r.status_code not in {200,206}:return None
              for rec in ArchiveIterator(io.BytesIO(r.content)):
                if rec.rec_type=='response':
                  body=rec.content_stream().read(max_bytes+1)
                  if len(body)>max_bytes:return None
                  ctype=rec.http_headers.get_header('Content-Type') if rec.http_headers else ''
                  return body,ctype or ''
            except Exception:return None
            return None

          def inspect(row):
            fetched=warc_body(row);item={'index':row.get('_index'),'label':row.get('_label'),'url':row.get('url'),'timestamp':row.get('timestamp')}
            if not fetched:return item
            body,ctype=fetched;text=body.decode('utf-8','ignore');soup=BeautifulSoup(text,'html.parser');visible=' '.join(soup.get_text(' ',strip=True).split());combined=(text+' '+visible).casefold();hits=sorted({t for t in TERMS if t.casefold() in combined},key=lambda x:(len(x),x));strong=bool(STRONG.intersection({x.casefold() for x in hits}))
            item.update(bytes=len(body),contentType=ctype,title=soup.title.get_text(' ',strip=True) if soup.title else '',visible=visible[:15000],hits=hits,strong=strong)
            if hits:
              name=re.sub(r'[^A-Za-z0-9._-]+','_',f"{item['label']}-{item['timestamp']}-{item['url']}")[:180]+'.html';(RAW/name).write_bytes(body);item['file']='raw/'+name
            return item

          inspected=[]
          with concurrent.futures.ThreadPoolExecutor(max_workers=10) as ex:
            for item in ex.map(inspect,rows[:2500]):inspected.append(item)
          candidates=[x for x in inspected if x.get('hits')]
          strong=[x for x in candidates if x.get('strong')]
          (OUT/'inspected.json').write_text(json.dumps(inspected,ensure_ascii=False,indent=2));(OUT/'candidates.json').write_text(json.dumps(candidates,ensure_ascii=False,indent=2));(OUT/'strong-candidates.json').write_text(json.dumps(strong,ensure_ascii=False,indent=2))
          lines=['# Yalla Halloween Official Social Archive Scan','',f'- Common Crawl indexes: {len(indexes)}',f'- Official-handle records: {len(rows)}',f'- Snapshots inspected: {len(inspected)}',f'- Any Halloween-family hits: {len(candidates)}',f'- Strong exact Halloween/pumpkin hits: {len(strong)}','', '| # | Handle | Capture | URL | Hits | Title |','|---:|---|---|---|---|---|']
          for i,x in enumerate(strong,1):lines.append(f"| {i} | {x.get('label')} | `{x.get('timestamp')}` | `{x.get('url')}` | {', '.join(x.get('hits',[])[:12])} | {str(x.get('title','')).replace('|','/')} |")
          lines+=['','## All family-term candidates','']
          for x in candidates[:300]:lines += [f"### {x.get('label')} · `{x.get('timestamp')}` · `{x.get('url')}`",f"Hits: {', '.join(x.get('hits',[]))}",'',x.get('visible','')[:3000],'']
          (OUT/'REPORT.md').write_text('\n'.join(lines))
          print(json.dumps({'indexes':len(indexes),'records':len(rows),'inspected':len(inspected),'candidates':len(candidates),'strong':len(strong)},ensure_ascii=False,indent=2))
          PY
          python /tmp/social_scan.py 2>&1 | tee "$OUT_DIR/run.log"

      - name: Publish compact social results
        if: always()
        run: |
          set -Eeuo pipefail
          stage=/tmp/yalla-halloween-social-public
          rm -rf "$stage" && mkdir -p "$stage"
          for f in REPORT.md indexes.json query-summary.json records.json candidates.json strong-candidates.json run.log; do cp "$OUT_DIR/$f" "$stage/" 2>/dev/null || true; done
          git config user.name 'pro-yalla-halloween-bot'
          git config user.email '53897102+moongrant@users.noreply.github.com'
          git switch --orphan "$RESULT_BRANCH"
          git rm -rf . >/dev/null 2>&1 || true
          cp -a "$stage"/. .
          git add .
          git commit -m "Publish Yalla Halloween official social archive scan ${GITHUB_RUN_ID}"
          git push --force origin "$RESULT_BRANCH"

      - name: Upload social archaeology artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: yalla-halloween-official-social-archive
          path: ${{ env.OUT_DIR }}
          if-no-files-found: warn
          compression-level: 6
          retention-days: 30
