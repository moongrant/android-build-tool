name: Yalla Halloween official social archive v2

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/yalla-halloween-official-social-v2.yml
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  scan:
    runs-on: ubuntu-22.04
    timeout-minutes: 180
    env:
      RESULT_BRANCH: pro-yalla-halloween-social-v2-results
      OUT_DIR: artifacts/yalla-halloween-social-v2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Search corrected Common Crawl and Wayback prefixes for official Yalla handles
        run: |
          set -Eeuo pipefail
          python -m pip install requests beautifulsoup4 lxml warcio
          mkdir -p "$OUT_DIR/raw"
          cat > /tmp/social_v2.py <<'PY'
          from __future__ import annotations
          import concurrent.futures, contextlib, hashlib, io, json, re, time
          from collections import defaultdict
          from pathlib import Path
          from urllib.parse import quote
          import requests
          from bs4 import BeautifulSoup
          from warcio.archiveiterator import ArchiveIterator

          OUT=Path('artifacts/yalla-halloween-social-v2');RAW=OUT/'raw';RAW.mkdir(parents=True,exist_ok=True)
          S=requests.Session();S.headers.update({'User-Agent':'Mozilla/5.0 Chrome/127 Safari/537.36','Accept':'*/*'})
          PREFIXES=[
            ('facebook-current','www.facebook.com/YallaVoiceChatRooms'),
            ('facebook-current-bare','facebook.com/YallaVoiceChatRooms'),
            ('facebook-current-mobile','m.facebook.com/YallaVoiceChatRooms'),
            ('facebook-legacy','www.facebook.com/yalla2016'),
            ('facebook-legacy-bare','facebook.com/yalla2016'),
            ('facebook-legacy-mobile','m.facebook.com/yalla2016'),
            ('twitter-legacy','twitter.com/yalladotlive/status'),
            ('twitter-legacy-mobile','mobile.twitter.com/yalladotlive/status'),
            ('x-current','x.com/YallaDotLive/status'),
          ]
          TERMS=['halloween','هالوين','cadılar bayramı','cadilar bayrami','dia das bruxas','noche de brujas','pumpkin','pumpkins','اليقطين','قرع','balkabağı','balkabagi','abóbora','abobora','calabaza','citrouille','trick or treat','trick-or-treat','خدعة أم حلوى','ghost','ghosts','شبح','أشباح','hayalet','fantasma','fantôme','fantome','witch','witches','ساحرة','ساحر','cadı','cadi','bruxa','bruja','sorcière','sorciere','candy','candies','حلوى','şeker','seker','doces','dulces','bonbon','haunted','مسكون','perili','assombrado','embrujado','hanté','hante','spooky','مخيف','skeleton','هيكل عظمي','zombie','vampire']
          STRONG={x.casefold() for x in ['halloween','هالوين','cadılar bayramı','cadilar bayrami','dia das bruxas','noche de brujas','pumpkin','pumpkins','اليقطين','قرع','balkabağı','balkabagi','abóbora','abobora','calabaza','citrouille','trick or treat','trick-or-treat','خدعة أم حلوى']}
          def get(url,timeout=(20,120),tries=3,headers=None):
            for i in range(tries):
              try:
                r=S.get(url,timeout=timeout,headers=headers,allow_redirects=True)
                if r.status_code in {429,500,502,503,504} and i+1<tries:time.sleep(1.2*(i+1));continue
                return r
              except Exception:
                if i+1<tries:time.sleep(1.2*(i+1))
            return None
          def hits(text):
            low=text.casefold();out=[]
            for term in TERMS:
              t=term.casefold()
              if re.fullmatch(r'[A-Za-z][A-Za-z -]*',term):
                if re.search(r'(?<![A-Za-z])'+re.escape(t)+r'(?![A-Za-z])',low):out.append(term)
              elif t in low:out.append(term)
            return sorted(set(out),key=lambda x:(len(x),x.casefold()))
          coll=get('https://index.commoncrawl.org/collinfo.json',timeout=(20,60));indexes=[]
          if coll and coll.status_code==200:
            by=defaultdict(list)
            for item in coll.json():
              m=re.search(r'CC-MAIN-(20\d{2})-',str(item.get('id','')))
              if m and 2018<=int(m.group(1))<=2026:by[int(m.group(1))].append(item)
            for year,items in sorted(by.items()):
              ordered=sorted(items,key=lambda x:x['id'],reverse=True);indexes.extend(ordered[::2]);
              if ordered and ordered[0] not in indexes:indexes.append(ordered[0])
          (OUT/'indexes.json').write_text(json.dumps([x['id'] for x in indexes],indent=2))
          def cc(index,label,prefix):
            url=index['cdx-api']+'?url='+quote(prefix,safe='')+'&matchType=prefix&output=json&filter=status:200&collapse=urlkey'
            r=get(url,timeout=(25,150),tries=2);rows=[]
            if r and r.status_code==200:
              for line in r.text.splitlines():
                with contextlib.suppress(Exception):
                  item=json.loads(line)
                  if isinstance(item,dict):item.update(_index=index['id'],_label=label,_prefix=prefix);rows.append(item)
            return {'source':'cc','index':index['id'],'label':label,'prefix':prefix,'query':url,'http':r.status_code if r else None,'bytes':len(r.content) if r else 0,'rows':rows}
          def wb(label,prefix):
            params=[('url',prefix+'/*'),('output','json'),('fl','timestamp,original,statuscode,mimetype,digest,length'),('filter','statuscode:200'),('collapse','urlkey'),('limit','20000')]
            url='https://web.archive.org/cdx/search/cdx?'+'&'.join(f'{quote(k,safe="")}={quote(v,safe="*:/.()[]|^$+-_")}' for k,v in params)
            r=get(url,timeout=(30,180),tries=3);rows=[]
            if r and r.status_code==200:
              with contextlib.suppress(Exception):
                data=r.json()
                if isinstance(data,list) and data:
                  head=data[0]
                  for raw in data[1:]:
                    if isinstance(raw,list):item=dict(zip(head,raw));item.update(_label=label,_prefix=prefix);rows.append(item)
            return {'source':'wb','label':label,'prefix':prefix,'query':url,'http':r.status_code if r else None,'bytes':len(r.content) if r else 0,'rows':rows}
          queries=[]
          with concurrent.futures.ThreadPoolExecutor(max_workers=16) as ex:
            fut=[ex.submit(cc,index,label,prefix) for index in indexes for label,prefix in PREFIXES]+[ex.submit(wb,label,prefix) for label,prefix in PREFIXES]
            for f in concurrent.futures.as_completed(fut):
              with contextlib.suppress(Exception):queries.append(f.result())
          rows=[]
          for q in queries:rows.extend(q['rows'])
          ded={}
          for row in rows:ded[(row.get('_index'),row.get('timestamp'),row.get('url') or row.get('original'),row.get('digest'))]=row
          rows=list(ded.values());(OUT/'query-summary.json').write_text(json.dumps([{k:v for k,v in q.items() if k!='rows'}|{'rowCount':len(q['rows'])} for q in queries],ensure_ascii=False,indent=2));(OUT/'records.json').write_text(json.dumps(rows,ensure_ascii=False,indent=2))
          def cc_body(row,maxb=15_000_000):
            try:
              length=int(row.get('length') or 0);offset=int(row.get('offset') or 0);filename=row.get('filename')
              if not filename or length<=0 or length>maxb:return None
              r=get('https://data.commoncrawl.org/'+filename,timeout=(30,150),tries=2,headers={'Range':f'bytes={offset}-{offset+length-1}'})
              if not r or r.status_code not in {200,206}:return None
              for rec in ArchiveIterator(io.BytesIO(r.content)):
                if rec.rec_type=='response':return rec.content_stream().read(maxb+1)
            except Exception:return None
          def wb_body(row,maxb=15_000_000):
            ts=str(row.get('timestamp',''));url=str(row.get('original',''))
            if not ts or not url:return None
            r=get(f'https://web.archive.org/web/{ts}id_/{url}',timeout=(30,150),tries=2)
            return r.content if r and r.status_code==200 and len(r.content)<=maxb else None
          def inspect(row):
            source='cc' if row.get('_index') else 'wb';body=cc_body(row) if source=='cc' else wb_body(row);url=row.get('url') or row.get('original');item={'source':source,'index':row.get('_index'),'label':row.get('_label'),'timestamp':row.get('timestamp'),'url':url}
            if not body:return item
            text=body.decode('utf-8','ignore');soup=BeautifulSoup(text,'html.parser');visible=' '.join(soup.get_text(' ',strip=True).split());combined=text+' '+visible;hh=hits(combined)
            images=[]
            for tag,attr in [('meta','content'),('img','src'),('source','src')]:
              for el in soup.find_all(tag):
                val=el.get(attr)
                if val and re.search(r'https?://|\.png|\.jpe?g|\.webp',val,re.I):images.append(val)
            item.update(bytes=len(body),sha256=hashlib.sha256(body).hexdigest(),title=soup.title.get_text(' ',strip=True) if soup.title else '',visible=visible[:16000],hits=hh,strong=bool(STRONG & {x.casefold() for x in hh}),images=images[:300],imageHits=[x for x in images if hits(x)])
            if hh or item['imageHits']:
              name=hashlib.sha1((source+str(item['timestamp'])+str(url)).encode()).hexdigest()+'.html';(RAW/name).write_bytes(body);item['file']='raw/'+name
            return item
          inspected=[]
          with concurrent.futures.ThreadPoolExecutor(max_workers=10) as ex:
            for item in ex.map(inspect,rows[:4000]):inspected.append(item)
          candidates=[x for x in inspected if x.get('hits') or x.get('imageHits')];strong=[x for x in candidates if x.get('strong') or x.get('imageHits')]
          (OUT/'inspected.json').write_text(json.dumps(inspected,ensure_ascii=False,indent=2));(OUT/'candidates.json').write_text(json.dumps(candidates,ensure_ascii=False,indent=2));(OUT/'strong-candidates.json').write_text(json.dumps(strong,ensure_ascii=False,indent=2))
          lines=['# Yalla Halloween Official Social Archive v2','',f'- Common Crawl indexes: {len(indexes)}',f'- Corrected official-prefix records: {len(rows)}',f'- Snapshots inspected: {len(inspected)}',f'- Halloween-family candidates: {len(candidates)}',f'- Strong exact/image candidates: {len(strong)}','', '| # | Handle | Capture | URL | Hits | Image hits |','|---:|---|---|---|---|---:|']
          for i,x in enumerate(strong,1):lines.append(f"| {i} | {x.get('label')} | `{x.get('timestamp')}` | `{x.get('url')}` | {', '.join(x.get('hits',[])[:12])} | {len(x.get('imageHits',[]))} |")
          for x in strong[:200]:lines+=['',f"## {x.get('label')} · `{x.get('timestamp')}`",'',x.get('visible','')[:5000],'']
          (OUT/'REPORT.md').write_text('\n'.join(lines));print(json.dumps({'indexes':len(indexes),'records':len(rows),'inspected':len(inspected),'candidates':len(candidates),'strong':len(strong)},ensure_ascii=False,indent=2))
          PY
          python /tmp/social_v2.py 2>&1 | tee "$OUT_DIR/run.log"

      - name: Publish corrected official social evidence
        if: always()
        run: |
          set -Eeuo pipefail
          stage=/tmp/yalla-social-v2-public
          rm -rf "$stage" && mkdir -p "$stage"
          for f in REPORT.md indexes.json query-summary.json records.json candidates.json strong-candidates.json run.log; do cp "$OUT_DIR/$f" "$stage/" 2>/dev/null || true; done
          git config user.name 'pro-yalla-halloween-bot'
          git config user.email '53897102+moongrant@users.noreply.github.com'
          git switch --orphan "$RESULT_BRANCH"
          git rm -rf . >/dev/null 2>&1 || true
          cp -a "$stage"/. .
          git add .
          git commit -m "Publish corrected Yalla Halloween social archive ${GITHUB_RUN_ID}"
          git push --force origin "$RESULT_BRANCH"

      - name: Upload corrected social archive artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: yalla-halloween-official-social-v2
          path: ${{ env.OUT_DIR }}
          if-no-files-found: warn
          compression-level: 6
          retention-days: 30
