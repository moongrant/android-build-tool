name: Yalla historical CDN asset closure

on:
  push:
    branches: [main]
    paths:
      - tools/yalla-next-batch/historical_cdn_closure.py
      - .github/workflows/yalla-historical-cdn-closure.yml
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  recover:
    runs-on: ubuntu-22.04
    timeout-minutes: 150
    env:
      RESULT_BRANCH: pro-yalla-historical-cdn-closure-results
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Recover historical root and CDN resources from public archives
        run: |
          python -m pip install requests beautifulsoup4 warcio
          python -m py_compile tools/yalla-next-batch/historical_cdn_closure.py
          rm -rf pro-yalla-historical-cdn-closure
          python tools/yalla-next-batch/historical_cdn_closure.py 2>&1 | tee historical-cdn-closure.log
      - name: Publish compact closure summary
        if: always()
        run: |
          set -Eeuo pipefail
          stage=/tmp/yalla-historical-cdn-closure
          rm -rf "$stage" && mkdir -p "$stage"
          for f in REPORT.md results.json; do cp "pro-yalla-historical-cdn-closure/$f" "$stage/" 2>/dev/null || true; done
          cp historical-cdn-closure.log "$stage/" 2>/dev/null || true
          git config user.name 'pro-yalla-archive-bot'
          git config user.email '53897102+moongrant@users.noreply.github.com'
          git switch --orphan "$RESULT_BRANCH"
          git rm -rf . >/dev/null 2>&1 || true
          cp -a "$stage"/. .
          git add .
          git commit -m "Publish historical Yalla CDN closure ${GITHUB_RUN_ID}"
          git push --force origin "$RESULT_BRANCH"
      - name: Upload full closure artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pro-yalla-historical-cdn-closure
          path: pro-yalla-historical-cdn-closure
          if-no-files-found: warn
          compression-level: 0
          retention-days: 30
