name: Yalla historical snapshot fast probe

on:
  push:
    branches: [main]
    paths:
      - tools/yalla-next-batch/historical_snapshot_probe.py
      - .github/workflows/yalla-historical-snapshot-probe.yml
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  probe:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    env:
      RESULT_BRANCH: pro-yalla-historical-snapshot-probe-results
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Probe archived HTML and first two asset layers
        run: |
          python -m pip install requests beautifulsoup4
          python -m py_compile tools/yalla-next-batch/historical_snapshot_probe.py
          rm -rf pro-yalla-historical-snapshot-probe
          python tools/yalla-next-batch/historical_snapshot_probe.py 2>&1 | tee historical-snapshot-probe.log
      - name: Publish probe result branch
        if: always()
        run: |
          set -Eeuo pipefail
          stage=/tmp/yalla-historical-snapshot-probe
          rm -rf "$stage" && mkdir -p "$stage"
          cp -R pro-yalla-historical-snapshot-probe/. "$stage/" 2>/dev/null || true
          cp historical-snapshot-probe.log "$stage/" 2>/dev/null || true
          git config user.name 'pro-yalla-probe-bot'
          git config user.email '53897102+moongrant@users.noreply.github.com'
          git switch --orphan "$RESULT_BRANCH"
          git rm -rf . >/dev/null 2>&1 || true
          cp -a "$stage"/. .
          git add .
          git commit -m "Publish Yalla historical snapshot probe ${GITHUB_RUN_ID}"
          git push --force origin "$RESULT_BRANCH"
      - name: Upload probe artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pro-yalla-historical-snapshot-probe
          path: pro-yalla-historical-snapshot-probe
          if-no-files-found: warn
          compression-level: 0
          retention-days: 30
