name: Yalla next batch URLScan root inventory

on:
  push:
    branches: [main]
    paths:
      - tools/yalla-next-batch/urlscan_roots.py
      - .github/workflows/yalla-next-batch-urlscan.yml
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  scan:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    env:
      RESULT_BRANCH: pro-yalla-next-batch-urlscan-results
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install and scan URLScan
        run: |
          python -m pip install requests
          python -m py_compile tools/yalla-next-batch/urlscan_roots.py
          rm -rf pro-yalla-next-batch-urlscan
          python tools/yalla-next-batch/urlscan_roots.py | tee yalla-urlscan.log
      - name: Publish result branch
        if: always()
        run: |
          set -Eeuo pipefail
          stage=/tmp/yalla-urlscan
          rm -rf "$stage" && mkdir -p "$stage"
          cp pro-yalla-next-batch-urlscan/urlscan-roots.json "$stage/" 2>/dev/null || true
          cp pro-yalla-next-batch-urlscan/REPORT.md "$stage/" 2>/dev/null || true
          cp yalla-urlscan.log "$stage/" 2>/dev/null || true
          git config user.name 'pro-yalla-urlscan-bot'
          git config user.email '53897102+moongrant@users.noreply.github.com'
          git switch --orphan "$RESULT_BRANCH"
          git rm -rf . >/dev/null 2>&1 || true
          cp -a "$stage"/. .
          git add .
          git commit -m "Publish Yalla URLScan roots ${GITHUB_RUN_ID}"
          git push --force origin "$RESULT_BRANCH"
      - name: Upload artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pro-yalla-next-batch-urlscan
          path: pro-yalla-next-batch-urlscan
          if-no-files-found: warn
          retention-days: 30
