name: Yalla OkHttp interceptor decompile

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/yalla-okhttp-interceptors-decompile.yml
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  decompile:
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    env:
      RESULT_BRANCH: pro-yalla-okhttp-interceptors-results
    steps:
      - uses: actions/checkout@v4
      - name: Download current public APK
        run: |
          set -Eeuo pipefail
          mkdir -p /tmp/apkeep /tmp/yalla out
          docker pull ghcr.io/efforg/apkeep:stable
          docker run --rm -v /tmp/apkeep:/output ghcr.io/efforg/apkeep:stable -a com.weieyu.yalla -d apk-pure /output
          package="$(find /tmp/apkeep -type f \( -name '*.xapk' -o -name '*.apks' -o -name '*.apk' \) -printf '%s %p\n' | sort -nr | head -1 | cut -d' ' -f2-)"
          test -n "$package"
          if [[ "$package" == *.apk ]]; then cp "$package" /tmp/yalla/base.apk; else unzip -q "$package" -d /tmp/yalla/splits; base="$(find /tmp/yalla/splits -type f \( -name 'com.weieyu.yalla.apk' -o -name 'base.apk' \) -printf '%s %p\n' | sort -nr | head -1 | cut -d' ' -f2-)"; cp "$base" /tmp/yalla/base.apk; fi
      - name: Install JADX
        run: |
          set -Eeuo pipefail
          url="$(curl --fail --silent --show-error -H 'Accept: application/vnd.github+json' https://api.github.com/repos/skylot/jadx/releases/latest | jq -r '.assets[] | select(.name | test("^jadx-[0-9].*\\.zip$")) | .browser_download_url' | head -1)"
          curl --fail --location --retry 5 --retry-all-errors -o /tmp/jadx.zip "$url"
          unzip -q /tmp/jadx.zip -d /tmp/jadx
      - name: Decompile every OkHttp interceptor in Yalla API client
        run: |
          set -Eeuo pipefail
          mkdir -p out/classes
          classes=(
            'p483o0o00O0O.o0ooOOo'
            'p483o0o00O0O.o00000'
            'p483o0o00O0O.o000000'
            'p483o0o00O0O.o000000O'
            'p483o0o00O0O.o00oO0o'
            'p483o0o00O0O.o00000O'
            'p483o0o00O0O.o0Oo0oo'
            'p483o0o00O0O.o00000OO'
            'p483o0o00O0O.o0000'
            'p483o0o00O0O.o0OOO0o'
            'p483o0o00O0O.o00000O0'
            'p474o0o000O0.o000oOoO'
            'com.yalla.yalla.http.OooOOOO'
            'com.code.android.util.o0Oo0oo'
            'com.code.android.util.o00OOO0'
            'com.yalla.yalla.api.call.request.ParamsWrapper'
          )
          for cls in "${classes[@]}"; do
            safe="$(printf '%s' "$cls" | tr '.' '_' | tr '$' '@')"
            /tmp/jadx/bin/jadx --no-res --show-bad-code --single-class "$cls" --single-class-output "out/classes/${safe}.java" /tmp/yalla/base.apk > "out/classes/${safe}.stdout.txt" 2> "out/classes/${safe}.stderr.txt" || true
          done
          cat out/classes/*.java > out/all-interceptors.txt
          rg -n -i -C 30 'intercept\(|header\(|addHeader|removeHeader|token|userid|userId|device|timestamp|sign|signature|md5|sha|hmac|user-agent|country|region|language|version|Authorization|Abnormal|Request.Builder|url\(' out/classes > out/focused.txt || true
          {
            echo '# Yalla OkHttp Interceptors'
            echo
            find out/classes -name '*.java' -printf '%f %s bytes\n' | sort
            echo
            echo '```'
            sed -n '1,12000p' out/focused.txt
            echo '```'
          } > out/REPORT.md
      - name: Publish results
        if: always()
        run: |
          set -Eeuo pipefail
          git config user.name 'pro-yalla-source-bot'
          git config user.email '53897102+moongrant@users.noreply.github.com'
          git switch --orphan "$RESULT_BRANCH"
          git rm -rf . >/dev/null 2>&1 || true
          cp -a out/. .
          git add .
          git commit -m "Publish Yalla OkHttp interceptors ${GITHUB_RUN_ID}"
          git push --force origin "$RESULT_BRANCH"
      - name: Upload artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: yalla-okhttp-interceptors
          path: out
          if-no-files-found: warn
          compression-level: 6
          retention-days: 30
