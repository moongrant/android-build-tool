name: Yalla request client targeted decompile

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/yalla-request-client-targeted-decompile.yml
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  decompile:
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    env:
      RESULT_BRANCH: pro-yalla-request-client-source-results
    steps:
      - uses: actions/checkout@v4
      - name: Download current public Yalla APK
        run: |
          set -Eeuo pipefail
          mkdir -p /tmp/apkeep /tmp/yalla out
          docker pull ghcr.io/efforg/apkeep:stable
          docker run --rm -v /tmp/apkeep:/output ghcr.io/efforg/apkeep:stable -a com.weieyu.yalla -d apk-pure /output
          package="$(find /tmp/apkeep -type f \( -name '*.xapk' -o -name '*.apks' -o -name '*.apk' \) -printf '%s %p\n' | sort -nr | head -1 | cut -d' ' -f2-)"
          test -n "$package"
          if [[ "$package" == *.apk ]]; then cp "$package" /tmp/yalla/base.apk; else unzip -q "$package" -d /tmp/yalla/splits; base="$(find /tmp/yalla/splits -type f \( -name 'com.weieyu.yalla.apk' -o -name 'base.apk' \) -printf '%s %p\n' | sort -nr | head -1 | cut -d' ' -f2-)"; cp "$base" /tmp/yalla/base.apk; fi
          sha256sum /tmp/yalla/base.apk > out/base.sha256
      - name: Install JADX
        run: |
          set -Eeuo pipefail
          url="$(curl --fail --silent --show-error -H 'Accept: application/vnd.github+json' https://api.github.com/repos/skylot/jadx/releases/latest | jq -r '.assets[] | select(.name | test("^jadx-[0-9].*\\.zip$")) | .browser_download_url' | head -1)"
          curl --fail --location --retry 5 --retry-all-errors -o /tmp/jadx.zip "$url"
          unzip -q /tmp/jadx.zip -d /tmp/jadx
      - name: Decompile exact request and client classes
        run: |
          set -Eeuo pipefail
          mkdir -p out/classes
          classes=(
            'com.yalla.yalla.api.old.OooOOO'
            'com.yalla.yalla.api.old.OooO'
            'com.yalla.yalla.api.old.OooOO0'
            'com.yalla.yalla.api.old.OooOO0O'
            'com.yalla.yalla.api.old.OooOOO0'
            'com.yalla.yalla.api.call.core.HttpCoreRequest'
            'com.yalla.yalla.api.call.core.IHttpService'
            'com.yalla.yalla.api.call.OooO'
            'com.yalla.yalla.api.call.OooO0o'
            'com.yalla.yalla.api.call.request.ParamsWrapper'
            'p442o0OoOoo.o00'
            'p442o0OoOoo.o00O0000'
            'p442o0OoOoo.o000OOo0'
            'p474o0o000O0.o000oOoO'
            'com.yalla.yalla.data.manager.OooO00o'
            'com.yalla.yalla.data.repository.OooO0O0'
            'com.yalla.yalla.data.repository.ActivityCenterRepo$getActivityList$$inlined$call$1'
          )
          for cls in "${classes[@]}"; do
            safe="$(printf '%s' "$cls" | tr '.' '_' | tr '$' '@')"
            /tmp/jadx/bin/jadx --no-res --show-bad-code --single-class "$cls" --single-class-output "out/classes/${safe}.java" /tmp/yalla/base.apk > "out/classes/${safe}.stdout.txt" 2> "out/classes/${safe}.stderr.txt" || true
          done
          cat out/classes/*.java > out/targeted-source.txt
          grep -Eo 'new [A-Za-z0-9_.$]+' out/targeted-source.txt | sort -u > out/constructed-classes.txt || true
          grep -Eo 'import [A-Za-z0-9_.$]+' out/targeted-source.txt | sort -u > out/imported-classes.txt || true
          rg -n -i -C 30 'OkHttpClient|addInterceptor|addNetworkInterceptor|header|query|sign|signature|timestamp|token|device|User-Agent|VisitorLogin|GetActivityListForCenter' out/classes > out/focused.txt || true
          {
            echo '# Yalla Request Client Targeted Source'
            echo
            echo '## Classes'
            find out/classes -name '*.java' -printf '%f %s bytes\n' | sort
            echo
            echo '## Constructed classes'
            cat out/constructed-classes.txt
            echo
            echo '## Focused request pipeline'
            echo '```'
            sed -n '1,5000p' out/focused.txt
            echo '```'
          } > out/REPORT.md
      - name: Publish source branch
        if: always()
        run: |
          set -Eeuo pipefail
          git config user.name 'pro-yalla-source-bot'
          git config user.email '53897102+moongrant@users.noreply.github.com'
          git switch --orphan "$RESULT_BRANCH"
          git rm -rf . >/dev/null 2>&1 || true
          cp -a out/. .
          git add .
          git commit -m "Publish Yalla request client source ${GITHUB_RUN_ID}"
          git push --force origin "$RESULT_BRANCH"
      - name: Upload source artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: yalla-request-client-source
          path: out
          if-no-files-found: warn
          compression-level: 6
          retention-days: 30
