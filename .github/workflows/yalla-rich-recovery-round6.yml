name: Yalla historical rich SPA recovery round 6

on:
  push:
    branches: [main]
    paths:
      - tools/yalla-rich-recovery-round6/recover.py
      - tools/yalla-rich-recovery/recover.py
      - .github/workflows/yalla-rich-recovery-round6.yml
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  recover:
    runs-on: ubuntu-22.04
    timeout-minutes: 420
    env:
      OUT_DIR: pro-yalla-rich-spa-increment-round6
      ZIP_NAME: pro-yalla-rich-spa-increment-round6.zip
      RESULT_BRANCH: pro-yalla-rich-round6-results
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install recovery dependencies
        run: |
          set -Eeuo pipefail
          python -m pip install --upgrade pip
          python -m pip install requests beautifulsoup4 pillow playwright==1.55.0
          python -m playwright install --with-deps chromium
      - name: Recover eight archived official Yalla SPAs
        id: recover
        continue-on-error: true
        env:
          YALLA_OUT: ${{ env.OUT_DIR }}
        run: |
          set -Eeuo pipefail
          rm -rf "$OUT_DIR"
          python tools/yalla-rich-recovery-round6/recover.py 2>&1 | tee yalla-round6-recovery.log
      - name: Preserve recovery log and validate structure
        if: always()
        run: |
          set -Eeuo pipefail
          mkdir -p "$OUT_DIR"/{activities,data,assets,fixtures,screenshots,registry,replay,logs}
          cp yalla-round6-recovery.log "$OUT_DIR/logs/" 2>/dev/null || true
          test -s "$OUT_DIR/registry/yalla-activity-registry-round6.json"
          test -s "$OUT_DIR/RESULT-BOARD.md"
          python - <<'PY'
          import json
          from pathlib import Path
          path=Path('pro-yalla-rich-spa-increment-round6/registry/yalla-activity-registry-round6.json')
          data=json.loads(path.read_text())
          print('attempted',len(data.get('activities',[])))
          print('accepted',data.get('acceptedCount'))
          print('rejected',data.get('rejectedCount'))
          PY
      - name: Package full increment and verify ZIP
        if: always()
        run: |
          set -Eeuo pipefail
          rm -f "$ZIP_NAME" "$ZIP_NAME.sha256"
          zip -q -r "$ZIP_NAME" "$OUT_DIR"
          unzip -t "$ZIP_NAME" | tail -n 4
          sha256sum "$ZIP_NAME" | tee "$ZIP_NAME.sha256"
          find "$OUT_DIR" -type f | wc -l | tee "$OUT_DIR/data/file-count.txt"
          du -sh "$OUT_DIR" "$ZIP_NAME" | tee "$OUT_DIR/data/size-report.txt"
      - name: Publish downloadable result branch
        if: always()
        run: |
          set -Eeuo pipefail
          stage=/tmp/yalla-round6-public
          rm -rf "$stage" && mkdir -p "$stage"
          for file in RESULT-BOARD.md README.md QA.md; do cp "$OUT_DIR/$file" "$stage/" 2>/dev/null || true; done
          cp "$OUT_DIR/registry/yalla-activity-registry-round6.json" "$stage/" 2>/dev/null || true
          cp "$OUT_DIR/registry/yalla-activity-registry-round6.csv" "$stage/" 2>/dev/null || true
          cp "$OUT_DIR/screenshots/round6-contact-sheet.jpg" "$stage/" 2>/dev/null || true
          cp "$ZIP_NAME.sha256" "$stage/"
          size=$(stat -c%s "$ZIP_NAME")
          if [ "$size" -lt 95000000 ]; then
            cp "$ZIP_NAME" "$stage/"
            mode=single
            files='["pro-yalla-rich-spa-increment-round6.zip"]'
          else
            split -b 45000000 -d -a 3 "$ZIP_NAME" "$stage/pro-yalla-rich-spa-increment-round6.zip.part-"
            mode=split
            files=$(cd "$stage" && python - <<'PY'
          import glob,json
          print(json.dumps([x.split('/')[-1] for x in sorted(glob.glob('pro-yalla-rich-spa-increment-round6.zip.part-*'))]))
          PY
          )
          fi
          python - <<PY
          import json,os
          from pathlib import Path
          stage=Path('$stage')
          payload={
            'runId':'${GITHUB_RUN_ID}',
            'runUrl':'https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}',
            'commit':'${GITHUB_SHA}',
            'generatedAt':os.popen('date -u +%FT%TZ').read().strip(),
            'mode':'$mode',
            'files':json.loads('''$files'''),
            'zipSha256':Path('$ZIP_NAME.sha256').read_text().split()[0],
            'zipBytes':int('$size'),
            'rawBase':'https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/${RESULT_BRANCH}/'
          }
          (stage/'DOWNLOAD.json').write_text(json.dumps(payload,indent=2))
          PY
          git config user.name 'pro-yalla-recovery-bot'
          git config user.email '53897102+moongrant@users.noreply.github.com'
          git switch --orphan "$RESULT_BRANCH"
          git rm -rf . >/dev/null 2>&1 || true
          cp -a "$stage"/. .
          git add .
          git commit -m "Publish Pro-Yalla rich SPA increment round 6 ${GITHUB_RUN_ID}"
          git push --force origin "$RESULT_BRANCH"
      - name: Upload complete Actions artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pro-yalla-rich-spa-increment-round6
          path: |
            ${{ env.ZIP_NAME }}
            ${{ env.ZIP_NAME }}.sha256
            ${{ env.OUT_DIR }}
          if-no-files-found: warn
          compression-level: 0
          retention-days: 30
