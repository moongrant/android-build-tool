// 盲盒玩法房间内通知实体
message MessageBlindBoxNotify{
  int32 RedirectType = 1; // 跳转类型(0-不需要跳转;1-跳转背包(客户端根据用户视角来))
  int64 SendUserId = 2;   // 送礼用户ID
  string SendUserNick = 3;// 送礼用户昵称
  int64 GetUserId = 4;    // 收礼用户Id
  string GetUserNick = 5; // 收礼用户昵称
