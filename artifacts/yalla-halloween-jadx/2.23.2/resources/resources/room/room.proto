  int32 RewardType = 7;   // 0-无;1-信誉值;2-积分;3-送出XX个礼盒
  int32 RewardId = 8;     // 奖品Id
  int32 Coin = 9;         // 价值
  repeated MessageBlindBoxPropName PropNameText = 10;   // 礼物名称翻译
  repeated MessageBlindBoxPropName RewardPropNameText = 11; // 礼物名称翻译
}

