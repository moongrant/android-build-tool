    int32 AllowMicStatus=2;    // 当前管理员麦位控制权限。 0 没有权限  1 有权限
}

//head= 1000003. 房主给管理员设置/取消设置 锁麦/解锁麦权限，通知所有在房用户
message AllowMicRightOut {
    int32 Code = 1;
    int64 RoomId = 2;          // 房间Id
    int32 AllowMicStatus=3;    // 当前管理员麦位控制权限。 0 没有权限  1 有权限
}

// 统一错误功能提示 1000005 2.11.13新增的错误都走这里处理
message ErrorEvent {
	int32 errcode =  1;       // 具体错误码   （版本升级errcode=3000 通用错误errcode=3001 ... ）
	int32 pckcode =  2;       // 具体业务码
    string content = 3;       // 提示内容json ，服务端传  。  格式：{"msg":"金币不足","region":1}
}

// 发起投票(1100000)
message InitiateVoteRequest {
    string title = 1;       // 投票标题(最少1个字符，最多60字符)
    int64 giftId = 2;       // 投票礼物
    enum DurationType // 持续时间
    {
        NoDef = 0;      //未定义  (if DurationType==0 then DurationType=默认值)，防止后面需求改动，尽量指定值
        FiveMin = 1;    //5min 默认值
        TenMin = 2;    //10min
        ThirtyMin = 3;  //30min
        SixtyMin = 4;   //60min
        Infinite = 100; //永久
    }
    DurationType durationType = 3;
    repeated int64 userIds = 4;  // 参与人(最少2个最多10个)
}
// 发起投票返回结果(1100000)
message InitiateVoteReply {
    int32 code = 1;			// 新增返回错误码4000：已经存在进行中的投票了
    int64 voteId = 2;       // 投票器ID
    int64 createUserId = 3; // 发起人
    UserModel createUserView = 4;// 发起人个人信息
}
// 手动提前结束投票(1100001)
message EndVoteRequest {
    int64 voteId = 1;  // 投票器ID
}
// 结束成功后，将广播最终结果给客户端如下(1100001)
message VoteResultNotify {
    int64 voteId = 1;  // 投票器ID
    int64 roomId = 2;  //
    message userTotalCount {
        int64 userId = 1;
        int32 totalCount = 2; //得票数
      string nickName = 3;
    }
  repeated userTotalCount result = 3;
  UserModel createUserView = 4;// 发起人个人信息
  string giftImage = 5;
}
//投票排行变动通知 (1100002)，客户端收到后，主动调用接口查询榜单
message NumOfVotesUpdateNotifyIn {
  int64 roomId = 1;
}


//猜拳过期通知
message MoraExpiredNotify {
    int64 roomId = 1;
    int64 muuid = 2;
}

