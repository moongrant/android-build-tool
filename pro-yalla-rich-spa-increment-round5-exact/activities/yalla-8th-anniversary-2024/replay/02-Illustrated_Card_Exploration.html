<body style="overflow: auto;">
    <div id="activityOver" style="width: 100%; height: 100%; text-align: center; display: none !important;">
        <img style="width:24%;margin:4rem 0 1rem;" src="https://file.yalla.live/Activity/ActivityOver/xiaoma.png">

    </div>
    
    <script>
        //  参数过滤
        function filterSearch() {
            var str = window.location.search.replace("?", "");
            var obj = {
            };
            if (str.length < 1) return obj;
            var keyValues = str.split("&");
            keyValues.forEach(function (keyValue) {
                var tempArr = keyValue.split("=");
                var key = tempArr[0];
                var value = tempArr[1].indexOf("|") > 0 ? tempArr[1].split("|") : tempArr[1];
                obj[key] = value;
            });
            if (obj['userid']) {
                obj['userId'] = obj['userid'];
            }
            return obj;
        }
        var search = filterSearch();
        search.region = parseInt(search.region);

    </script>
    <script type="text/javascript">
        var region = search.region;
        switch (region) {
            case 1:
                $("#tips1").css("direction", "rtl").text("لقد تأخرت، انتهى النشاط! المزيد من النشاط قادم قريبا…");
                break;
            case 2:
                $("#tips1").text("Bu aktivite sona erdi. Yeni aktiviteler çok yakında!");
                break;
            case 3:
                $("#tips1").text("Anda terlambat. Aktivitas telah selesai Aktivitas selanjutnya akan datang.");
                break;
            case 5:
                $("#tips1").text("A atividade já terminou. Mais atividades interessantes em breve......");
                break;
            case 6:
                $("#tips1").text("La actividad ha terminado. Más muy pronto…");
                break;
            case 7:
                $("#tips1").text("गतिविधि समाप्त हो गई है। अधिक,जल्द आ रहा…");
                break;

                break;
        }
    </script>
